<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Untangle · Soft fox motion</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f5;color:#26233e;font:16px/1.5 'Avenir Next','Trebuchet MS',sans-serif}.phone{width:390px;min-height:780px;background:white;margin:30px auto;border:1px solid #dfe0e8;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;padding:28px 24px 20px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:11px;color:#686379;background:#f4f1fa;border-radius:10px;padding:4px 9px}.progress{height:5px;background:#eeebf4;border-radius:5px;margin:23px 0 32px}.progress:after{content:'';display:block;width:25%;height:100%;background:#8060d2;border-radius:5px}h1{font-size:31px;line-height:1.18;letter-spacing:-.8px;margin:0 0 15px}.lead{font-size:15px;color:#726d82;max-width:27ch;margin:0}.journey{list-style:none;padding:0;margin:32px 0 20px}.journey li{display:flex;gap:16px;align-items:center;position:relative;padding-bottom:25px}.journey li:not(:last-child):before{content:'';position:absolute;left:17px;top:37px;height:24px;width:2px;background:#e5dff3}.number{width:36px;height:36px;border:1px solid #d3c5f1;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#7250bd;flex-shrink:0}.journey strong{font-size:15px}.companion{margin-top:auto;padding-top:16px;border-top:1px solid #efedf3;display:flex;gap:0;align-items:center;min-height:170px}.fox{width:150px;height:150px;flex:0 0 150px;overflow:visible}.bubble{font-size:14px;line-height:1.5;position:relative;border:1px solid #e7e1f0;background:#fbfaff;border-radius:16px;padding:13px 12px}.bubble:before{content:'';position:absolute;left:-6px;top:40%;width:10px;height:10px;background:#fbfaff;border-left:1px solid #e7e1f0;border-bottom:1px solid #e7e1f0;transform:rotate(45deg)}.mood-picker{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding:18px 0 8px;font-size:13px;color:#726d82}.mood-picker select{font:inherit;font-weight:700;color:#655481;border:1px solid #e0d9eb;border-radius:10px;background:white;padding:9px 12px;max-width:160px}.companion{margin-top:0!important}.mood-picker select:focus-visible{outline:3px solid #b293e8;outline-offset:3px}.controls{display:flex;gap:9px;margin-top:8px}button{font:inherit;font-size:14px;cursor:pointer;border-radius:12px;padding:12px;border:1px solid #e0d9eb;background:white;color:#655481;flex:1}button.primary{background:#7956c6;color:white;border-color:#7956c6;font-weight:700}button:focus-visible{outline:3px solid #b293e8;outline-offset:3px}.footnote{font-size:11px;color:#847e91;text-align:center;margin:13px 0 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:500px){body{background:white}.phone{width:100%;min-height:100svh;border:0;border-radius:0;margin:0;padding:22px 22px max(18px,env(safe-area-inset-bottom))}.progress{margin:20px 0 27px}}@media(max-width:350px){.phone{padding-left:17px;padding-right:17px}.fox{width:125px;height:125px;flex-basis:125px}.bubble{font-size:13px}.companion{min-height:145px}h1{font-size:28px}.journey{margin-top:24px}}
</style></head><body><main class="phone"><header class="top"><b class="brand">untangle</b><span class="tag">Motion preview</span></header><div class="progress" aria-hidden="true"></div><section aria-label="Example lesson layout"><h1>Every choice has a ripple.</h1><p class="lead">A little story. A choice to make. Something new to discover.</p><ol class="journey"><li><span class="number">1</span><strong>Make a choice</strong></li><li><span class="number">2</span><strong>Watch what changes</strong></li><li><span class="number">3</span><strong>Discover the idea</strong></li></ol></section><label class="mood-picker" for="mood">Try a gesture<select id="mood"><option value="waiting">Wave hello</option><option value="speaking">Explain</option><option value="thinking">Think</option><option value="surprised">React</option><option value="celebrating">Celebrate</option></select></label><footer class="companion"><canvas id="fox" class="fox" width="600" height="600" role="img" aria-label="Your fox guide waves hello"></canvas><div class="bubble" id="bubble" aria-live="polite">I’m here to help.<br>One move at a time.</div></footer><div class="controls"><button class="primary" id="replay">Replay fox</button><button id="pause" aria-pressed="false">Pause motion</button></div><p class="footnote" id="note">Character preview · no lesson starts here</p><span class="sr" id="status" role="status"></span></main><script src="fox-b/gestures.js"></script></body></html>
