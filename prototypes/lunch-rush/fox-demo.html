<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Untangle · Meet your fox</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#27354b;font:16px/1.5 'Avenir Next','Trebuchet MS',sans-serif}main{max-width:780px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}header b{font-size:25px;letter-spacing:-1px}header span{font-size:12px;color:#617086}h1{font-size:32px;letter-spacing:-1px;margin:26px 0 4px}p{margin:0;color:#607085}.stage{background:#e5eef2;border-radius:32px;margin:24px 0;position:relative;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.bubble{background:white;border-radius:18px;padding:13px 22px;position:relative;text-align:center;max-width:85%;font-weight:700;min-height:50px;box-shadow:0 4px 0 #c8d9e1}.bubble:after{content:'';position:absolute;bottom:-11px;left:48%;border:6px solid transparent;border-top-color:white}.fox{width:245px;height:280px;overflow:visible;margin-top:12px}.shadow{fill:#c0d2dc}.body,.head,.arm,.ear,.tail,.pupil,.eyelid,.mouth{transform-box:fill-box;transform-origin:center;transition:transform .25s ease}.head{transform-origin:50% 90%}.arm{transform-box:view-box}.arm.left{transform-origin:89px 178px}.arm.right{transform-origin:158px 178px}.tail{transform-origin:15% 80%}.ear{transform-origin:50% 90%}.fox .tail{animation:tail 3.4s ease-in-out infinite}.eyes{transform-origin:125px 107px;animation:blink 4.6s infinite}.body{animation:breath 3.5s ease-in-out infinite}.mouth-open,.mouth-o,.mouth-grin{opacity:0}.mouth-open{transform-box:fill-box;transform-origin:center}.brows{stroke:#995036;stroke-width:4;stroke-linecap:round;fill:none}.spark{opacity:0;fill:#e8ac35}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}button{font:inherit;cursor:pointer;border:1px solid #ccd6df;border-bottom:3px solid #bccad6;border-radius:13px;background:white;color:#384862;padding:12px 5px;font-size:13px;font-weight:700}button[aria-pressed=true]{background:#624ba1;color:white;border-color:#49387c}button:focus-visible{outline:3px solid #b187ea;outline-offset:4px}.bottom{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:22px}.bottom p{font-size:13px;max-width:440px}.bottom button{padding:10px 18px;white-space:nowrap}.state-label{display:none;position:absolute;top:8px;left:19px;font-size:12px;color:#526a7e}.speaking .mouth-smile{opacity:0}.speaking .mouth-open{animation:talk .7s steps(1) infinite}.speaking .head{animation:nod 1.2s ease-in-out infinite}.speaking .arm.right{animation:gesture 1.2s ease-in-out infinite}.thinking .head{transform:rotate(-9deg)}.thinking .pupil{transform:translate(4px,-3px)}.thinking .arm.right{transform:rotate(110deg)}.thinking .ear.left{transform:rotate(-13deg)}.thinking .brows{transform:translateY(-3px)}.surprised .eyes{animation:none;transform:scaleY(1.17)}.surprised .mouth-smile{opacity:0}.surprised .mouth-o{opacity:1}.surprised .head{animation:surprise .7s ease both}.surprised .arm.left{transform:rotate(55deg)}.surprised .arm.right{transform:rotate(-55deg)}.surprised .ear.left{transform:rotate(-12deg)}.surprised .ear.right{transform:rotate(12deg)}.surprised .brows{transform:translateY(-7px)}.celebrating .body{animation:jump .72s ease-in-out 3}.celebrating .arm.left{animation:cheerL .72s ease-in-out 3;transform:rotate(110deg)}.celebrating .arm.right{animation:cheerR .72s ease-in-out 3;transform:rotate(-110deg)}.celebrating .mouth-smile{opacity:0}.celebrating .mouth-grin{opacity:1}.celebrating .head{transform:rotate(7deg)}.celebrating .tail{animation:tail .35s ease-in-out 6}.celebrating .spark{animation:sparkle .8s ease 3}.celebrating .shadow{animation:shadow .72s ease-in-out 3;transform-origin:center;transform-box:fill-box}.waiting .pupil{animation:look 6s ease-in-out infinite}.paused *{animation-play-state:paused!important}@keyframes tail{50%{transform:rotate(9deg)}}@keyframes breath{50%{transform:translateY(-2px)}}@keyframes blink{0%,43%,48%,100%{transform:scaleY(1)}45%,46%{transform:scaleY(.07)}}@keyframes look{0%,30%,80%,100%{transform:translateX(0)}40%,65%{transform:translateX(3px)}}@keyframes talk{0%,100%{opacity:1;transform:scaleY(.45)}25%{opacity:1;transform:scaleY(1)}65%{opacity:1;transform:scaleY(.65)}}@keyframes nod{50%{transform:rotate(-4deg) translateY(2px)}}@keyframes gesture{50%{transform:rotate(-65deg)}}@keyframes surprise{0%{transform:translateY(0)}35%{transform:translateY(-9px) rotate(-5deg)}100%{transform:translateY(-3px)}}@keyframes jump{0%,100%{transform:translateY(0)}25%{transform:translateY(4px) scaleY(.95)}55%{transform:translateY(-22px) rotate(-3deg)}}@keyframes cheerL{50%{transform:rotate(115deg)}100%{transform:rotate(105deg)}}@keyframes cheerR{50%{transform:rotate(-115deg)}100%{transform:rotate(-105deg)}}@keyframes sparkle{20%,80%{opacity:1}50%{transform:translateY(-10px)}}@keyframes shadow{55%{transform:scaleX(.7);opacity:.5}}@media(max-width:550px){main{padding:18px}.stage{min-height:380px;margin:20px 0}.controls{grid-template-columns:repeat(3,1fr)}h1{font-size:27px}.bottom{align-items:start}.bottom p{max-width:200px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.speaking .mouth-open{opacity:1}}
</style></head><body><main><header><b>untangle</b><span>Character rehearsal</span></header><h1>A fox with something to say.</h1><p>Tap a mood. Watch the face, ears, paws, and posture.</p><section class="stage" aria-label="Animated fox preview"><span class="state-label" id="stateLabel">Waiting</span><div class="bubble" id="bubble" aria-live="polite">I’m here. Take your time.</div><svg class="fox waiting" id="fox" viewBox="0 0 250 280" role="img" aria-label="Fox waiting patiently"><ellipse class="shadow" cx="126" cy="265" rx="67" ry="9"/><g class="body"><g class="tail"><path d="M153 234 Q224 246 223 158 Q213 188 181 183 Q202 213 153 216Z" fill="#ed884b"/><path d="M223 158 Q229 188 214 208 L195 189 Q215 187 223 158" fill="#ac4269"/></g><path d="M101 245 L100 259 M147 245 L149 259" stroke="#34425a" stroke-width="17" stroke-linecap="round"/><path d="M94 165 Q75 186 88 235 Q119 263 158 234 Q171 188 149 165" fill="#f39552"/><ellipse cx="124" cy="213" rx="24" ry="33" fill="#fff0d4"/><g class="arm left"><circle cx="89" cy="178" r="11" fill="#f39552"/><path d="M89 178 Q64 193 74 217" stroke="#f39552" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="74" cy="217" r="10" fill="#8e4939"/></g><g class="arm right"><circle cx="158" cy="178" r="11" fill="#f39552"/><path d="M158 178 Q180 194 171 217" stroke="#f39552" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="171" cy="217" r="10" fill="#8e4939"/></g><g class="head"><g class="ear left"><path d="M74 91 Q53 68 55 22 Q83 31 104 62" fill="#f39552"/><path d="M66 41 L72 76 L91 62Z" fill="#ae4168"/></g><g class="ear right"><path d="M145 64 Q168 31 192 22 Q196 63 178 96" fill="#f39552"/><path d="M180 42 L161 63 L177 80Z" fill="#ae4168"/></g><path d="M72 81 Q78 53 110 60 L121 47 L126 61 L143 52 L141 63 Q176 57 182 89 L184 127 Q164 171 126 178 Q82 165 67 129Z" fill="#ff9f5c"/><path d="M68 123 Q85 100 122 139 Q163 101 184 123 Q174 159 125 172 Q84 163 68 123" fill="#fff0d4"/><g class="eyes"><ellipse cx="101" cy="109" rx="12" ry="17" fill="white"/><ellipse cx="151" cy="109" rx="12" ry="17" fill="white"/><g class="pupil" fill="#2c394f"><ellipse cx="104" cy="111" rx="7" ry="11"/><ellipse cx="148" cy="111" rx="7" ry="11"/><g fill="white"><circle cx="105" cy="107" r="2.6"/><circle cx="149" cy="107" r="2.6"/></g></g></g><path class="brows" d="M91 85 Q100 81 109 86 M142 86 Q151 81 160 85"/><path d="M116 133 Q125 127 135 133 Q135 141 125 144 Q117 141 116 133" fill="#2c394f"/><path class="mouth-smile" d="M109 148 Q125 162 142 148" stroke="#2c394f" stroke-width="3.5" fill="none" stroke-linecap="round"/><g class="mouth-open"><ellipse cx="126" cy="153" rx="11" ry="9" fill="#533545"/><ellipse cx="126" cy="158" rx="6" ry="3" fill="#ed8190"/></g><ellipse class="mouth-o" cx="126" cy="154" rx="7" ry="10" fill="#533545"/><g class="mouth-grin"><path d="M109 147 Q125 154 142 147 Q139 172 124 166 Q113 165 109 147" fill="#533545"/><path d="M113 150 Q126 155 138 150 L136 155 L116 155Z" fill="white"/></g></g></g><g class="spark"><path d="M32 81 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z"/><path d="M210 59 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z"/><circle cx="209" cy="126" r="4"/></g></svg></section><div class="controls" aria-label="Choose a fox expression"><button data-mood="waiting" aria-pressed="true">Waiting</button><button data-mood="speaking" aria-pressed="false">Speaking</button><button data-mood="thinking" aria-pressed="false">Thinking</button><button data-mood="surprised" aria-pressed="false">Surprised</button><button data-mood="celebrating" aria-pressed="false">Celebrating</button></div><div class="bottom"><p id="description">A soft blink and a small glance while you decide.</p><button id="pause" aria-pressed="false">Pause motion</button></div></main><script>
const fox=document.querySelector('#fox');let paused=false;const moods={waiting:['I’m here. Take your time.','A soft blink and a small glance while you decide.'],speaking:['Let’s try one move together.','Mouth shapes, a head nod, and a paw gesture work together.'],thinking:['Hmm… what might happen next?','Eyes look up, one ear tilts, and a paw comes toward the chin.'],surprised:['Oh! That changed things.','Eyes widen, ears lift, and both paws open.'],celebrating:['You spotted it!','A little crouch, a jump, raised paws, and a broad smile.']};document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{fox.setAttribute('class','fox');void fox.getBoundingClientRect();fox.setAttribute('class','fox '+b.dataset.mood+(paused?' paused':''));fox.setAttribute('aria-label','Fox '+b.dataset.mood);document.querySelector('#bubble').textContent=moods[b.dataset.mood][0];document.querySelector('#description').textContent=moods[b.dataset.mood][1];document.querySelector('#stateLabel').textContent=b.textContent;document.querySelectorAll('[data-mood]').forEach(x=>x.setAttribute('aria-pressed',x===b));});document.querySelector('#pause').onclick=e=>{paused=!paused;fox.classList.toggle('paused',paused);e.target.textContent=paused?'Resume motion':'Pause motion';e.target.setAttribute('aria-pressed',paused);};
</script></body></html>
