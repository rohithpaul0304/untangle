/* ---------- chapter screens ---------- */
const CHAPS=[
 {n:1,t:'Should I talk first?',d:'Games, dominant strategy, the prisoner’s dilemma, and why people still cooperate',img:()=>A.ravi_cold,built:true},
 {n:2,t:'Why did Jio give it away free?',d:'Price wars, and changing the payoffs',img:()=>A.logo_jio,built:true},
 {n:3,t:'Why does everyone need coaching now?',d:'The arms race'},
 {n:4,t:'Why do people overbid at auctions?',d:'Second-price auctions, the professor’s coffee mug'},
 {n:5,t:'Why do IPL teams like the purse cap?',d:'A rule that rescues both sides'},
 {n:6,t:'Why does the chemist hand you a different brand?',d:'The middleman’s dilemma'},
 {n:7,t:'Where should the chaat cart stand?',d:'Crossing out bad moves'},
 {n:8,t:'When should you get out?',d:'Thinking one step past the crowd'}
];
function chapList(current){
  return CHAPS.map(c=>{const done=c.n<current;const lock=WEB&&c.n>1;const go=c.built&&!WEB;
    const st=done?'<span class="st">✓ done</span>':lock?'<span class="st">app</span>':c.built?'<span class="st" style="color:var(--blue)">'+(c.n===current?'next':'play')+'</span>':'<span class="st" style="color:#aaa">soon</span>';
    return `<${go?'button':'div'} class="chap ${go?'go':''} ${!c.built?'lock':''}" ${go?`data-ch="${c.n}"`:''} style="width:100%;background:#fff;font:inherit;color:inherit">${c.img?`<img src="${c.img()}" alt="" style="object-fit:contain">`:`<div class="ic">${c.n}</div>`}<div><div class="t">${c.n} · ${c.t}</div><div class="d">${c.d}</div></div>${st}</${go?'button':'div'}>`;}).join('');
}
function jumpCh(n){const k=STEPS.findIndex(s=>s.ch===n);if(k<0)return;STEPS.filter(s=>s.ch>=n).forEach(s=>{delete S.prog[s.id];delete S.prog[s.id+':g'];delete S.done[s.id];});go(k);}
function bindChaps(){app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>jumpCh(+b.dataset.ch));}
function renderChapter(st){
  const c=CHAPS[st.n-1];const built=c&&c.built;
  app.innerHTML=topbar()+`<div class="concept" style="padding-top:14px"><div style="text-align:center;margin-bottom:14px"><img src="${A.fox_celebrating}" alt="" style="width:88px"><h1 style="margin:6px 0 4px;font-size:22px">Chapter ${st.n-1} done.</h1><p style="color:var(--ink2);margin:0">✦ ${S.xp} XP so far. Next: ${c.t}</p></div>${chapList(st.n)}${built?'':'<p class="proto">Prototype · chapter '+st.n+' is next to build</p>'}</div>
  <div class="foot"><div class="brow"><button class="btn go" id="cont" ${built?'':'disabled'}>${built?'Play chapter '+st.n:'Chapter '+st.n+' coming next'}</button></div></div>`;
  bindChaps();
  if(built)document.getElementById('cont').onclick=next;
}
function renderEnd(){
  if(WEB){
    try{parent.postMessage({untangle:'done',xp:S.xp},'*');}catch(e){}
    app.innerHTML=topbar()+`<div class="concept" style="padding-top:14px"><div style="text-align:center;margin-bottom:14px"><img src="${A.fox_celebrating}" alt="" style="width:96px"><h1 style="margin:6px 0 4px;font-size:22px">You can see the game now.</h1><p style="color:var(--ink2);margin:0">Eight ideas from one police station. Jio’s price war and the next chapters are in the app.</p><p style="margin:6px 0 0;font-weight:700">✦ ${S.xp} XP earned</p></div>${chapList(2)}</div>
    <div class="foot"><div class="brow"><button class="btn ghost" id="again">Again</button><a class="btn go" id="appBtn" href="#app" target="_parent" style="display:grid;place-items:center;text-decoration:none">Continue in the app</a></div></div>`;
    document.getElementById('again').onclick=()=>{S.i=0;S.prog={};S.done={};S.xp=0;save();render();};
    document.getElementById('appBtn').onclick=e=>{e.preventDefault();if(parent!==window){try{parent.postMessage({untangle:'app'},'*');}catch(_){}}else location.href='index.html#app';};
    return;
  }
  app.innerHTML=topbar()+`<div class="concept" style="padding-top:14px"><div style="text-align:center;margin-bottom:14px"><img src="${A.fox_celebrating}" alt="" style="width:96px"><h1 style="margin:6px 0 4px;font-size:22px">You can see the game now.</h1><p style="color:var(--ink2);margin:0">Three worlds, one table, one opponent so far: tit for tat. The other opponents, and the tournament, are in the app. ✦ ${S.xp} XP.</p></div>${chapList(4)}</div>
  <div class="foot"><div class="brow"><button class="btn ghost" id="again">↺ Again</button><button class="btn go" id="appBtn">Continue in the app</button></div></div>`;
  document.getElementById('again').onclick=()=>{S.i=0;S.prog={};S.done={};S.xp=0;save();render();};
  document.getElementById('appBtn').onclick=()=>openWhy('<strong>Store links go here.</strong> Chapters one to three stay free in the app. New opponents, the tournament, and every chapter after live there.');
}

/* ---------- router ---------- */
function render(){
  closeSheet();app.classList.remove('glow','noir');
  const st=STEPS[S.i];
  ({question:renderQuestion,learn:renderLearn,recap:renderRecap,deal:renderDeal,quiz1:renderQuiz1,jiowatch:renderJioWatch,jio:renderJio,flip:renderFlip,seat:renderSeat,where:renderWhere,nights:renderNights,strategy:renderStrategy,tomorrow:renderTomorrow,trap:renderTrap,intro:renderIntro,play:renderPlay,cafe:renderCafe,concept:renderConcept,matrix:renderMatrix,text:renderText,splash:renderSplash,quiz:renderQuiz,street:renderStreet,fates:renderFates,applied:renderApplied,news3:renderNews3,chapter:renderChapter,end:renderEnd})[st.type](st);
  app.querySelector('.x').onclick=()=>{
    openWhy('<strong>Start a chapter again?</strong> Your choices in that chapter are cleared.<span style="display:flex;flex-direction:column;gap:8px;margin-top:14px">'+CHAPS.filter(c=>c.built&&(!WEB||c.n===1)).map(c=>`<button class="btn ghost" style="width:100%;height:46px" data-restart="${c.n}">Chapter ${c.n}: ${c.t}</button>`).join('')+(WEB&&parent===window?'<a class="btn ghost" style="width:100%;height:46px;display:grid;place-items:center;text-decoration:none" href="index.html">Back to the website</a>':'')+'</span>');
    document.getElementById('whyOk').textContent='Keep playing';
    document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{closeWhy();document.getElementById('whyOk').textContent='Got it';if(+b.dataset.restart===1){S.xp=0;S.miss={};}jumpCh(+b.dataset.restart);});
  };
}
window.addEventListener('message',e=>{if(e.data&&e.data.untangle==='xp'&&typeof e.data.xp==='number'&&S.xp===0){S.xp=e.data.xp;save();render();}});
render();
</script>
