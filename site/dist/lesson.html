:root{
  --bg:#FFFBF8;--ink:#1F1F1F;--ink2:#6E6A66;--line:#EBE4DD;
  --blue:#4960C8;--blue-bd:#C9CFEE;--blue-bg:#ffffff;--slot:#CFC8C0;
  --green:#7CB342;--green-bg:#EAF5D6;--bar:#EBE4DD;--lime:#D9F26B;
  --btn:#1F1F1F;--btn-off:#EFEAE4;--btn-off-ink:#B5AFA9;
  --navy:#2F3A46;--navy-grid:#45515E;--purple:#8E9AFE;--orange:#E9653B;--sand:#EBE4DD;--olive:#6D8D5D;
  --r:16px;--font:"Bricolage Grotesque",Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
/* top bar */
.top{display:flex;align-items:center;gap:12px;height:36px}
.top .x{width:28px;height:28px;display:grid;place-items:center;color:#555;font-size:18px}
.bar{flex:1;height:8px;background:var(--bar);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s ease}
.dots{display:flex;gap:6px}
.dots b{width:8px;height:8px;border-radius:50%;background:#d6d6d6}
.dots b.on{background:var(--green)}
.bolt{color:#c9e100;font-size:18px}
/* body */
.prompt{margin:18px 0 14px;font-size:16px;min-height:22px}
.prompt strong{font-weight:600}
.stage{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.stage .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:13px;font-weight:600}
.stage .hd .st{display:flex;align-items:center;gap:8px}
.stage .hd .st:before{content:"";width:12px;height:12px;border-radius:50%;border:3px solid #dfe5f7;background:var(--blue)}
.tag{border:1px solid #cfcfcf;border-radius:4px;padding:2px 6px;font-size:12px;font-weight:600}
.tag small{font-size:8px;letter-spacing:.04em;margin-left:4px;color:#555}
/* world */
.world{background:linear-gradient(#e9eef5,#dfe6f0);padding:14px 12px 10px;position:relative}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{background:#fff;border:1px solid #d9dfea;border-radius:10px;padding:24px 8px 8px;text-align:center;position:relative;transition:box-shadow .2s}
.room.lit{box-shadow:0 0 0 2px var(--blue)}
.room .cbars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,#9aa6bd 22px 25px);opacity:.18;border-radius:10px;pointer-events:none}
.face{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#f3f3f3;display:block;margin:0 auto 6px;transition:transform .25s}
.face.pop{transform:scale(1.08)}
.room .nm{font-size:13px;font-weight:600}
.room .yrs{font-size:12px;color:var(--ink2);margin-top:2px;min-height:17px}
.room .yrs b{color:var(--ink);font-size:15px}
.room .bubble{position:absolute;z-index:2;top:4px;left:50%;transform:translate(-50%,4px);background:#fff;border:1px solid var(--blue-bd);color:var(--blue);font-size:11px;font-weight:600;border-radius:8px;padding:2px 6px;opacity:0;transform:translateY(4px);transition:all .25s}
.room .bubble.on{opacity:1;transform:translate(-50%,0)}
.total{text-align:center;font-size:12px;color:var(--ink2);margin-top:10px}
.total b{color:var(--ink);font-size:14px}
/* program lines */
.prog{padding:10px 12px 12px}
.row{display:flex;align-items:center;gap:10px;min-height:38px;padding:2px 4px;border-radius:6px;transition:background .2s}
.row.cur{background:#f0f0f0}
.row .n{width:18px;text-align:right;font-size:13px;color:#6E6A66;flex:none;display:grid;place-items:center}
.row.cur .n{color:var(--ink)}
.row .who{font-size:13px;color:var(--ink2);width:54px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:5px 9px;font-size:14px;line-height:1.2;white-space:nowrap;cursor:pointer;user-select:none;transition:transform .15s,opacity .15s}
.chip b{font-weight:700}
.chip.lock{cursor:default;opacity:.85}
.chip.hidden{opacity:0;transform:scale(.6)}
.chip:active{transform:scale(.96)}
.slot{display:inline-block;width:118px;height:30px;border:1.5px dashed var(--slot);border-radius:6px;cursor:pointer}
.slot.hot{border-color:var(--blue);background:#f4f7ff}
.qm{display:inline-grid;place-items:center;width:118px;height:30px;border:1px solid #e6e6e6;border-radius:6px;color:#9a9a9a;font-size:13px}
.tick{color:var(--green);font-size:15px}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:14px 8px 6px}
/* buttons */
.foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:12px}
.fox{width:48px;height:60px;object-fit:contain;flex:none}
.btn{flex:1;height:50px;border:0;border-radius:99px;background:var(--btn);color:#fff;font:600 16px var(--font);cursor:pointer;transition:background .2s,color .2s}
.btn:disabled{background:var(--btn-off);color:var(--btn-off-ink);cursor:default}
.btn.go{background:var(--green)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cfcfcf;height:44px;flex:none;padding:0 16px;font-weight:500}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;background:none;border:0;cursor:pointer;padding:8px 2px;font-family:var(--font)}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
/* toast */
.toast{position:fixed;left:0;right:0;bottom:0;background:var(--green-bg);padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .3s ease;z-index:5}
.toast.on{transform:none}
.toast .in{max-width:398px;margin:0 auto}
.toast .t{font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.toast .t small{color:#2f8a44;font-weight:600}
.toast .t em{font-style:normal;font-weight:400;color:#444;margin-left:auto;font-size:14px}
.dim{opacity:.25;filter:grayscale(.5);pointer-events:none;transition:opacity .4s}
/* concept */
.concept{padding:8px 0}
.concept p{font-size:16px;margin:0 0 18px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .col h4{margin:0 0 6px;font-size:12px;text-align:center}
.mini .lines{display:flex;flex-direction:column;gap:6px;font-size:12px}
.mini .lines span{color:var(--blue)}
.mini .lines span b{font-weight:700}
.matrix{background:var(--navy);border-radius:8px;padding:8px;color:#dfe3ff;font-size:11px;display:grid;grid-template-columns:auto 1fr 1fr;gap:3px}
.matrix div{padding:5px 2px;text-align:center;border-radius:4px}
.matrix .h{color:#9aa4e8;font-size:10px}
.matrix .c{background:#1b2350;font-weight:600}
.matrix .c.hi{background:#3a46a8;color:#fff}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.splash img{width:120px}
.splash h2{margin:0;font-size:22px}
.splash p{margin:0;color:var(--ink2)}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0}
/* grid stage for skill check */
.gridw{background:var(--navy);background-image:linear-gradient(var(--navy-grid) 1px,transparent 1px),linear-gradient(90deg,var(--navy-grid) 1px,transparent 1px);background-size:22px 22px;padding:16px 12px;display:flex;justify-content:center}
.pm{display:grid;grid-template-columns:70px 1fr 1fr;gap:4px;font-size:12px;color:#dfe3ff;min-width:250px}
.pm div{text-align:center;padding:7px 2px;border-radius:6px}
.pm .h{color:#aeb6f0;font-weight:600;font-size:11px}
.pm .c{background:#1b2350;border:1px solid #2a3470;font-weight:600;font-size:14px}
.pm .c.hi{background:#3a46a8;border-color:#7b86f0;color:#fff}
.pm .c.dimc{opacity:.35}
/* intro */
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 0}
.intro .art{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.phone{width:150px;height:230px;border:7px solid #3a3a3a;border-radius:26px;background:linear-gradient(#e9eef5,#dfe6f0);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.phone:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:56px;height:14px;background:#3a3a3a;border-radius:0 0 10px 10px}
.phone .cell{flex:1;background:#fff;border:1px solid #d9dfea;border-radius:8px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.phone .cell img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.phone .cell span{font-size:9px;font-weight:600}
.intro .stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.intro h1{margin:0 0 10px;font-size:26px;font-weight:700;letter-spacing:-.01em}
.phone .cell.you{box-shadow:0 0 0 2px var(--blue)}
.phone .cell.you em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;font-style:normal;font-size:9px;font-weight:700;border-radius:99px;padding:1px 7px}
.phone .cell small{font-size:9px;color:var(--ink2)}
.phone .cell.dimcell{opacity:.45}
.intro .beats{display:flex;gap:6px;margin-bottom:22px}
.intro .beats b{width:8px;height:8px;border-radius:50%;background:#d6d6d6}
.intro .beats b.on{background:var(--ink)}
.scene{width:100%;max-width:330px;height:250px;display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.scene img{max-width:100%;max-height:100%;object-fit:contain}
.scene img.inspector{width:190px;height:190px;border-radius:50%;object-fit:cover;background:#f3f3f3}
.scene img.rooms{border-radius:12px}
.dlg{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;text-align:left;max-width:340px;width:100%;box-shadow:0 6px 18px rgba(31,31,31,.07);margin-top:-8px}
.dlg:before{content:"";position:absolute;top:-8px;left:34px;width:14px;height:14px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.dlg .dwho{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.dlg .dwho img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:52% 22%;background:#ddd}
.intro .dlg h1.lead{margin:0;font-size:17px;line-height:1.4;font-weight:500;text-align:left;max-width:none}
.dlg.down{margin:0 0 14px}.dlg.down:before{top:auto;bottom:-8px;transform:rotate(225deg)}
.scene img.inspector_frustrated,.scene img.inspector_offer{border-radius:16px;box-shadow:0 10px 30px rgba(31,31,31,.12)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro p{margin:0;color:#333;max-width:320px}
/* nudge */
.nudge{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06);max-width:230px;line-height:1.3;opacity:0;transform:translateY(6px);transition:all .25s}
.nudge.on{opacity:1;transform:none}
.nudge:before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.foot{flex-wrap:wrap}
.foot .nrow{display:flex;align-items:center;gap:12px;width:100%}
.foot .brow{display:flex;align-items:center;gap:10px;width:100%}
/* success */
.stage.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,191,79,.18)}
.stage .okstrip{display:none;background:var(--green-bg);color:#1f7a33;font-weight:700;font-size:14px;text-align:center;padding:9px 12px;border-bottom:1px solid #bfe9c8}
.stage.ok .okstrip{display:block}
.stage.ok .hd{display:none}
#app.glow{box-shadow:inset 0 0 0 2px var(--green),0 0 24px rgba(47,191,79,.25);border-radius:18px;transition:box-shadow .3s}
.xp{display:flex;align-items:center;gap:4px;font-size:13px;color:#444;font-weight:600}
.xp i{color:var(--green);font-style:normal}
/* why sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .3s;z-index:9}
.sheet.on{transform:none}
.sheet .in{max-width:398px;margin:0 auto}
.sheet p{margin:0 0 14px;font-size:15px}
.sheet code{background:#f1f3f8;border-radius:4px;padding:1px 5px;font-size:13px;color:var(--blue)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
/* telecom case */
.nets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.net{background:#fff;border:1px solid #d9dfea;border-radius:10px;padding:8px 6px 8px;text-align:center;position:relative;transition:box-shadow .2s}
.net.lit{box-shadow:0 0 0 2px var(--blue)}
.net.you{border-color:var(--blue)}
.net .sim{width:44px;height:58px;margin:4px auto 6px;border-radius:8px;background:linear-gradient(160deg,#f7f9ff,#dfe6f5);border:1px solid #c9d4f5;position:relative}
.net .sim:before{content:"";position:absolute;left:8px;top:14px;width:28px;height:20px;border-radius:4px;background:linear-gradient(135deg,#f3c969,#d99a2b)}
.net .sim:after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:#fff;border-left:1px solid #c9d4f5;border-bottom:1px solid #c9d4f5;border-radius:0 8px 0 4px}
.net.jio .sim{background:linear-gradient(160deg,#eef6ff,#cfe3ff)}
.net .nm{font-size:12px;font-weight:700}
.net .nm small{display:block;font-size:10px;color:var(--ink2);font-weight:500}
.net .price{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:#fff;background:#2b2b2b;border-radius:4px;padding:2px 7px;position:relative;transition:transform .3s}
.net .price.free{background:var(--green)}
.net .price.drop{transform:translateY(3px) rotate(-6deg)}
.net .cust{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:8px 0 6px;min-height:21px}
.net .cust i{width:9px;height:9px;border-radius:50%;background:var(--blue);display:block;transition:all .5s}
.net .cust i.gone{background:#e1e1e1;transform:scale(.6)}
.net .rev{height:6px;background:#eee;border-radius:99px;overflow:hidden}
.net .rev b{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .6s}
.net .rev b.low{background:#e0533d}
.net .rl{font-size:10px;color:var(--ink2);margin-top:3px}
.net .you-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;font-size:9px;font-weight:700;border-radius:99px;padding:1px 7px}
.timeline{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:0 0 14px}
.timeline .tr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px;align-items:flex-start}
.timeline .tr:last-child{border-bottom:0}
.timeline .yr{flex:none;width:76px;font-weight:700;color:var(--blue);font-size:13px;padding-top:1px}
.pill{display:inline-block;background:#f1f3f8;border-radius:99px;padding:2px 9px;font-size:12px;color:#444;margin-right:4px}
/* news clipping */
.paper{background:#fbf8f1;border:1px solid #e4dccb;border-radius:4px;padding:14px 14px 12px;box-shadow:0 6px 18px rgba(0,0,0,.08);position:relative;transform:rotate(-1deg);margin:6px 4px 18px}
.paper.two{transform:rotate(1.2deg);margin-top:-6px}
.paper .mast{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7a6f5a;border-bottom:1px solid #d9d0bd;padding-bottom:6px;margin-bottom:8px}
.paper h3{margin:0 0 6px;font:700 19px/1.2 Georgia,"Times New Roman",serif;color:#1b1b1b}
.paper p{margin:0;font:14px/1.45 Georgia,"Times New Roman",serif;color:#2b2b2b}
.paper .tape{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);width:70px;height:16px;background:rgba(255,230,120,.75);border:1px solid rgba(0,0,0,.05)}
.paper .stamp{position:absolute;right:10px;bottom:8px;border:2px solid #c0392b;color:#c0392b;font:700 10px/1 var(--font);letter-spacing:.08em;padding:3px 6px;border-radius:3px;transform:rotate(-8deg);opacity:.85}
.caseq{font-size:12px;color:var(--ink2);margin:0 0 8px}
/* mapping */
.map{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.map .mr{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;padding:9px 12px;border-bottom:1px solid #f0f0f0;font-size:14px}
.map .mr:last-child{border-bottom:0}
.map .mr.h{background:#f7f8fb;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.map .mr .a{color:var(--ink)}
.map .mr .b{color:var(--blue);font-weight:600}
.map .mr .ar{text-align:center;color:#bbb}
/* end chapter list */
.chap{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:left}
.chap img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#f3f3f3;flex:none}
.chap .ic{width:40px;height:40px;border-radius:50%;background:#f1f3f8;display:grid;place-items:center;font-size:18px;flex:none}
.chap .t{font-weight:700;font-size:14px}
.chap .d{font-size:12px;color:var(--ink2)}
.chap .st{margin-left:auto;font-size:12px;font-weight:600;color:var(--green);flex:none}
.chap.lock{opacity:.7}.chap.lock .st{color:#999}
.stores{display:flex;gap:8px;justify-content:center;margin-top:10px}
.stores span{border:1px solid #cfcfcf;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:#444}

/* street + fates */
.street{border:1px solid var(--line);border-radius:12px;padding:12px;background:linear-gradient(#f7f9ff,#eef2fb);margin-bottom:10px;position:relative;overflow:hidden}
.notif{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.08);position:relative;z-index:2}
.notif img{width:36px;height:36px;border-radius:9px;flex:none}
.notif b{display:block;font-size:13px}
.notif span{font-size:12px;color:#444}
.notif em{font-style:normal;font-weight:800;color:var(--green)}
.street .queue{display:block;width:62%;margin:6px auto 0}
.street .cap{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px}
.rivals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.rv{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.rv img{width:34px;height:34px;border-radius:8px;object-fit:contain}
.rv span{display:block;font-size:11px;font-weight:700;margin-top:4px}
.rv small{display:block;font-size:10px;color:var(--blue)}
.fates{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ft{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;position:relative}
.ft img{width:34px;height:34px;border-radius:8px;object-fit:contain;flex:none}
.ft b{display:block;font-size:13px}
.ft span{font-size:12px;color:#444}
.ft em{margin-left:auto;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:4px;padding:2px 6px;flex:none;transform:rotate(-6deg)}
.tag-cut{color:#b45309;border:2px solid #b45309}
.tag-dead{color:#b3261e;border:2px solid #b3261e}
.tag-win{color:#1f7a33;border:2px solid #1f7a33}
.ft.dead{background:#fff5f5}.ft.dead img{filter:grayscale(1);opacity:.6}
.ft.win{background:#f2fbf4}
.chart{border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px}
.ch-t{font-size:13px;font-weight:700;margin-bottom:6px}
.cbars{display:flex;gap:14px;align-items:flex-end;height:140px;padding:22px 6px 0;box-sizing:border-box}
.cbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cbar b{display:block;width:100%;height:4%;background:var(--blue);border-radius:6px 6px 0 0;position:relative;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.cbar b.grow{height:var(--h)}
.cbar b i{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:700;color:var(--ink)}
.cbar span{font-size:11px;color:var(--ink2);margin-top:4px;text-align:center}
.cbar span small{display:block;font-size:9px;color:var(--blue)}
.ch-s{font-size:11px;color:#6E6A66;margin-top:6px}

/* applied screen */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pc{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;text-align:center}
.pc .face{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#f3f3f3;display:block;margin:0 auto 6px}
.pc .badge{position:absolute;top:10px;right:calc(50% - 52px);width:30px;height:30px;border-radius:8px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);background:#fff;object-fit:contain}
.pc .badge.b2{top:40px;right:calc(50% - 56px)}
.pc b{display:block;font-size:14px}
.pc span{font-size:12px;color:var(--ink2)}
.moves{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.mv{display:flex;align-items:center;gap:10px}
.mv i{font-style:normal;color:#aaa;font-weight:700}
.ptag.big{font-size:14px;padding:4px 10px;border-radius:6px;margin:0}
.ptag.big.cut{background:#b3261e}
.lm{display:grid;grid-template-columns:70px 1fr 1fr;gap:5px;background:var(--navy);border-radius:10px;padding:8px}
.lh{display:flex;align-items:center;justify-content:center;gap:5px;color:#aeb6f0;font-size:12px;font-weight:600}
.lh img{width:18px;height:18px;border-radius:4px;object-fit:contain;background:#fff}
.lc{position:relative;background:#1b2350;border:1px solid #2a3470;border-radius:6px;padding:8px 4px;color:#dfe3ff;font-family:var(--font);cursor:pointer;text-align:center;transition:background .2s}
.lc b{display:block;font-size:15px}
.lc span{display:block;font-size:10px;color:#aeb6f0;margin-top:2px}
.lc.hi{background:#3a46a8;border-color:#7b86f0;color:#fff}
.lc.sel{outline:2px solid #fff}
.lc em{position:absolute;top:-8px;right:-4px;font-style:normal;font-size:9px;font-weight:800;color:#fff;background:#b3261e;border-radius:4px;padding:1px 5px;transform:rotate(8deg)}
.lm-s{font-size:12px;color:var(--ink2);margin:8px 0 0}

/* tomorrow screen */
.tgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px}
.hrow.t4{grid-template-columns:58px 1fr 1fr 42px}
.hrow .hy{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.tcol .tt{text-align:left!important}
.tcol{border:1px solid var(--line);border-radius:12px;padding:8px;transition:border-color .4s,box-shadow .4s}
.tcol.bad{border-color:#e0533d;box-shadow:0 0 0 3px rgba(224,83,61,.12)}
.tcol.good{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,191,79,.15)}
.tcol .tt{font-weight:700;font-size:14px;text-align:center;margin-bottom:6px}
.tcol .th{display:grid;grid-template-columns:18px 1fr 1fr 18px;font-size:10px;color:var(--ink2);margin-bottom:2px}
.tcol .th span:nth-child(2){grid-column:2/3}
.tn{display:grid;grid-template-columns:52px 1fr 18px;grid-template-areas:"n me y" "n arr y" "n her y";align-items:center;row-gap:2px;padding:4px 0;border-top:1px solid #f0f0f0}
.tn .tnn{grid-area:n;font-size:11px;color:#6E6A66}
.tn .chip{font-size:11px;padding:3px 6px;justify-self:start}
.tn .chip:first-of-type{grid-area:me}
.tn .chip:last-of-type{grid-area:her}
.tn .chip.warn{border-color:#e0533d;color:#b3261e}
.tn .tarr{grid-area:arr;font-size:10px;color:#6E6A66;padding-left:4px}
.tn .tarr i{font-style:normal}
.tn .tarr i.none{color:var(--green);font-weight:700}
.tn b{grid-area:y;font-size:14px;text-align:right}
.ttot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-size:12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px}
.ttot b{font-size:18px}
.ttot .tbar{grid-column:1/3;height:6px;background:#eee;border-radius:99px;overflow:hidden}
.ttot .tbar i{display:block;height:100%;background:#e0533d;border-radius:99px;transition:width .8s}
.tcol.good .tbar i{background:var(--green)}
/* trap screen */
.tm{position:relative;display:grid;grid-template-columns:62px 1fr 1fr;gap:6px;background:var(--navy);border-radius:12px;padding:10px;margin-bottom:10px}
.tmh,.tmr{color:#aeb6f0;font-size:11px;font-weight:600;text-align:center;line-height:1.2;display:grid;place-items:center}
.tmh{padding:6px 2px}
.tmh img,.tmr img{width:20px;height:20px;border-radius:5px;background:#fff;object-fit:contain;display:block;margin:0 auto 2px}
.tmc span{display:block;font-size:10px;color:#aeb6f0;margin-top:3px}
.concept .beats{display:flex;gap:6px;margin:0 0 12px}
.concept .beats b{width:8px;height:8px;border-radius:50%;background:#d6d6d6}
.concept .beats b.on{background:var(--ink)}
.tmc{position:relative;background:#1b2350;border:1px solid #2a3470;border-radius:8px;padding:14px 4px;color:#dfe3ff;font-family:var(--font);text-align:center;transition:all .3s}
.tmc b{font-size:22px}
.tmc small{font-size:11px;color:#aeb6f0;margin-left:2px}
.tmc.lit{background:#26306e;border-color:#5560d6}
.tmc.win{box-shadow:inset 0 0 0 2px var(--green)}
.tmc.win:after{content:"better";position:absolute;top:-8px;right:6px;background:var(--green);color:#fff;font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px}
.tmc.trap{background:#5b1d1d;border-color:#e0533d;color:#fff}
.tmc.trap:after{content:"both end here";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#e0533d;color:#fff;font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;white-space:nowrap}
.tmc.wish{box-shadow:inset 0 0 0 2px var(--green)}
.tmc.wish:after{content:"both could have";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;white-space:nowrap}
.tmc.dim2{opacity:.45}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.stampname{position:absolute;right:-6px;top:-12px;border:3px solid #c0392b;color:#c0392b;background:rgba(255,255,255,.92);font:800 13px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:4px;transform:rotate(-8deg) scale(1.6);opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.4)}
.stampname.on{opacity:1;transform:rotate(-8deg) scale(1)}
.tsteps{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tsteps i{width:8px;height:8px;border-radius:50%;background:#d6d6d6}
.tsteps i.on{background:var(--green)}

/* company cards (ads) */
.room.co{padding-top:14px}
.tv{width:84px;height:62px;margin:4px auto 8px;border-radius:8px;background:#1b1b1b;border:4px solid #3a3a3a;display:grid;place-items:center;position:relative;transition:background .3s}
.tv span{color:#333;font-weight:800;font-size:18px;letter-spacing:.1em;transition:color .3s}
.tv.on{background:radial-gradient(circle at 50% 40%,#fff6c2,#f3c969 70%)}
.tv.on span{color:#b3261e}
.tv:after{content:"";position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:30px;height:6px;background:#3a3a3a;border-radius:0 0 4px 4px}
/* café cards */
.room.cafe{padding-top:14px}
.room.cafe .face{width:64px;height:64px}
.ptag{display:inline-block;background:#2b2b2b;color:#fff;font-size:12px;border-radius:4px;padding:1px 6px;margin-left:4px}
.cupbar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:6px 6px 4px}
.cupbar b{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .5s}
.daystrip{display:flex;gap:5px;justify-content:center;margin-top:10px}
.daystrip i{width:18px;height:8px;border-radius:99px;background:#e1e1e1}
.daystrip i.done{background:var(--green)}.daystrip i.now{background:var(--blue)}
/* price chips */
.chip.price{flex-direction:column;gap:0;padding:5px 10px 4px;line-height:1.15}
.chip.price small{font-size:10px;color:var(--ink2);font-weight:500}
.chip.price small em{font-style:normal;color:var(--ink);font-weight:600}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--blue-bd);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{width:40px;height:40px;border:0;background:#f4f7ff;color:var(--blue);font:700 20px var(--font);cursor:pointer}
.stepper button:disabled{color:#bbb;background:#f6f6f6}
.stepper .val{min-width:84px;text-align:center;font-size:18px;font-weight:700;color:var(--blue)}
.preview{font-size:12px;color:var(--ink2);margin-left:10px;line-height:1.25}
.preview b{color:var(--ink)}
.ft .ic{width:34px;height:34px;border-radius:8px;background:#f1f3f8;display:grid;place-items:center;font-size:18px;flex:none}

/* ---- polish pass (product UI): tactile, focus, reduced motion, numerals ---- */
/* radius system: cards 12px, chips and inputs 6-8px, buttons pill. Do not add other radii. */
.btn:not(:disabled):active{transform:translateY(1px) scale(.99)}
.btn.go{box-shadow:0 6px 18px rgba(47,191,79,.25)}
.btn:not(.ghost):not(:disabled):not(.go){box-shadow:0 6px 18px rgba(0,0,0,.14)}
.btn.ghost:active{background:#f5f5f5}
.chip:not(.lock):hover{background:#f7f9ff}
.stepper button:not(:disabled):active{background:#e8eeff}
:is(.btn,.chip,.stepper button,.link,.x):focus-visible{outline:3px solid rgba(45,91,215,.45);outline-offset:2px}
.yrs b,.ptag,.stepper .val,.total b,.xp,.cbar b i,.tmc b,.ttot b{font-variant-numeric:tabular-nums}
.stage{box-shadow:0 1px 2px rgba(27,27,27,.04)}
.nudge{box-shadow:0 2px 10px rgba(27,27,27,.07)}
#app>.prompt,#app>.stage,#app>.palette,#app>.concept,#app>.intro,#app>.splash{animation:fade .25s ease both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .face.pop{transform:none}.chip.hidden{opacity:1;transform:none}
}

.sky .sun{position:absolute;top:10px;right:14px;width:22px;height:22px;border-radius:50%;background:#F2C94C;box-shadow:0 0 0 6px rgba(242,201,76,.25)}
.sky .smog{position:absolute;top:8px;left:10px;width:60px;height:22px;border-radius:20px;background:rgba(80,80,80,.45)}.sky .smog.s2{left:50px;top:20px;width:70px}
.sky .cost{position:absolute;top:8px;left:8px;background:var(--green);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;text-transform:uppercase}
.sky .cost.pay{background:#E8542F}
.simg{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain}
.shop.chai .psign{right:6%;top:24%;transform:rotate(-2deg);background:#2b2b2b;font-size:14px;padding:2px 7px}
.shop.sweet .banner{top:9%}
.thumb{width:44px;height:44px;object-fit:contain;background:none;border-radius:0}
.fbb #again{flex:1.4}.fbb #cont.ghost{flex:1}
.foot .palette{margin:0 0 10px;width:100%;justify-content:center}
.foot .palette.coach{padding-top:40px}
.dline{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4}
.dline img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#F3EEE9;flex:none}
.coachline{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:600;border-radius:10px;padding:7px 12px;margin:0 0 10px}
.opts.coach .opt{animation:ring 1.4s ease-in-out infinite}
.nc .shut,.fates em{font-size:11px!important}
.veil .crowd,.veil .sky .cost,.veil .artcap{visibility:hidden}
.veil .cres{color:var(--ink2)}
.cres.pop{animation:cpop .35s ease-out}
@keyframes cpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

<script>
const A=JSON.parse(document.getElementById('assets').textContent);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- the two binary games ---------- */
const GAMES={
 prison:{a:'silent',b:'talk',chip:{silent:'<b>stay</b> silent',talk:'<b>talk</b>'},
  pay:{'silent|silent':[1,1],'talk|silent':[0,5],'silent|talk':[5,0],'talk|talk':[3,3]},
  you:'Ravi',her:'Meera',turn:'night',turns:'nights',
  fmt:n=>n===0?'<b>free</b>':`<b>${n}</b> ${n===1?'year':'years'}`,
  faceA:(me,her)=>!me?'scared':(me==='talk'&&her==='silent')?'ashamed':(me==='silent'&&her==='talk')?'scared':'cold',
  faceB:(me,her)=>!her?'thawing':(me==='silent'&&her==='silent')?'friendly':(me==='talk'&&her==='silent')?'hurt':(me==='silent'&&her==='talk')?'hard':'grim',
  card(side,me,her,val){const who=side==='A'?'Ravi':'Meera';const f=side==='A'?this.faceA(me,her):this.faceB(me,her);const img=side==='A'?A['ravi_'+f]:A['meera_'+f];
    return `<div class="room" id="room-${side}"><div class="cbars"></div><div class="bubble" id="bub-${side}"></div><img class="face" id="face-${side}" src="${img}" alt="${who}, ${side==='A'?this.faceA(me,her):this.faceB(me,her)}"><div class="nm">${who}</div><div class="yrs" id="yrs-${side}" role="status" aria-live="polite">${val==null?'&nbsp;':this.fmt(val)}</div></div>`;},
  react(side,me,her){const f=side==='A'?this.faceA(me,her):this.faceB(me,her);const el=document.getElementById('face-'+side);el.src=side==='A'?A['ravi_'+f]:A['meera_'+f];el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),250);},
  total:(t)=>`Total&nbsp; Ravi <b>${t[0]}</b> · Meera <b>${t[1]}</b>`},
 ads:{a:'save',b:'ad',chip:{save:'<b>save</b> the money',ad:'<b>run</b> the ads'},
  pay:{'save|save':[4,4],'ad|save':[5,1],'save|ad':[1,5],'ad|ad':[3,3]},
  you:'You',her:'Rival',turn:'year',turns:'years',
  fmt:n=>`<b>${n}</b> cr profit`,
  card(side,me,her,val){const who=side==='A'?'Your brand':'Rival brand';const on=(side==='A'?me:her)==='ad';
    return `<div class="room co" id="room-${side}"><div class="bubble" id="bub-${side}"></div><div class="tv ${on?'on':''}" id="tv-${side}"><span>AD</span></div><div class="nm">${who}</div><div class="yrs" id="yrs-${side}">${val==null?'&nbsp;':this.fmt(val)}</div></div>`;},
  react(side,me,her){const on=(side==='A'?me:her)==='ad';document.getElementById('tv-'+side).classList.toggle('on',on);},
  total:(t)=>`Total&nbsp; You <b>${t[0]}</b> · Rival <b>${t[1]}</b> cr`}
};
const CHIP=GAMES.prison.chip;

/* ---------- café economics (chapter 2) ---------- */
const CAFE={cost:50,min:50,max:100,step:10,label:p=>`₹<b>${p}</b>`,
  cups:(a,b)=>clamp(100+(b-a)*5,0,200),
  pair(a,b){const c=CAFE.cups(a,b);return [c*(a-50),(200-c)*(b-50),c,200-c];},
  faceB(a,b,prevB){if(a<b)return 'hurt';if(a===b&&a<100)return 'grim';if(prevB!=null&&b>prevB)return 'thawing';return 'friendly';}};

/* ---------- lesson definition ---------- */
const STEPS=[
 /* chapter 1: the prison. Played night by night; nothing resets, years carry. */
 {ch:1,id:'q1',type:'question',q:'Why do two smart people, each making the best move, end up worse off?',sub:'You’re Ravi. You’re about to find out the hard way.',btn:'Start'},
 {ch:1,id:'intro',type:'intro',beats:[
   {img:'jewellery',text:'Three jewellery shops in Jayanagar were robbed this month. The last one, last night.'},
   {img:'inspector_frustrated',dark:true,who:'Inspector Sharma',text:'Three jewellery shops. One month. No witness. No fingerprints. Just you and Meera. I know it was you, Ravi... I just can’t prove it.'},
   {pair:['ravi_scared','meera_hard'],who:'Meera',av:'meera_hard',tail:'right',text:'Ravi. Whatever he offers you in there, we say nothing. <strong>Promise me.</strong>',reply:'I promise.'},
   {img:'inspector_offer',dark:true,who:'Inspector Sharma',text:'So. One deal, Ravi. <strong>Talk.</strong> Give me Meera... and you walk out of here tonight. Free. <strong>But she’s next door.</strong> Hearing the exact same deal.'},
   {cells:true,tail:'none',who:'Inspector Sharma',text:'Separate rooms. You both answer at the same time. What she says decides <strong>your</strong> years, Ravi. What you say decides <strong>hers</strong>.',btn:'Continue'}]},
 {ch:1,id:'l_game',type:'learn',coach:true,n:1,of:8,term:'A game',
  def:'A situation where <strong>your result depends on what others choose</strong>, not only on what you choose.',
  short:'Your result depends on others’ choices too.',
  partsTitle:'Every game has three parts',
  parts:[['Players','Ravi and Meera'],['Strategies','The moves each can make: talk, or stay silent'],['Payoffs','What each player gets for every pair of moves: years in jail']],
  rule:'Every choice isn’t a game. It becomes a game when <strong>someone else’s choice changes your result</strong>.',
  check:{q:'Which one is a game?',hint:'Ask: does anyone else’s choice change my result?',
   opts:[{t:'Picking chocolate or vanilla ice cream'},{t:'Setting your chai price when another stall is next door',ok:true}],
   right:'Right. Your customers depend on your price <strong>and</strong> the other stall’s price. The ice cream depends only on you, so it’s just a choice.',
   wrong:'Not quite. Nobody else changes how much you enjoy your ice cream, so that’s just a choice. Your chai sales depend on the other stall’s price too. That’s a game.'},
  retry:{q:'Which one is a game?',hint:'Does someone else’s choice change your result?',
   opts:[{t:'Choosing which film to watch alone tonight'},{t:'Bidding for a used bike against other buyers',ok:true}],
   right:'Right. What you pay depends on what the other buyers bid.',
   wrong:'The bike’s price depends on what other buyers bid, so that is a game. The film tonight depends only on you.'},
  btn:'See the payoffs'},
 {ch:1,id:'payoffs',type:'intro',beats:[
   {duel:['silent','silent'],who:'Inspector Sharma',text:'Both of you keep your mouths shut? Then I can only book you for something small. <strong>One year each.</strong>'},
   {duel:['talk','silent'],who:'Inspector Sharma',text:'You talk, she stays quiet? You walk out of here tonight, free. <strong>She gets five years.</strong>'},
   {duel:['silent','talk'],who:'Inspector Sharma',text:'But if she talks and you don’t... <strong>she walks free, and you get five.</strong> Think about that.'},
   {duel:['talk','talk'],who:'Inspector Sharma',text:'And if you both talk? Then I have you both. <strong>Three years each.</strong> Your goal, Ravi: the fewest years.',btn:'Continue'}]},
 {ch:1,id:'l_assume',type:'learn',n:2,of:8,term:'Two assumptions',
  def:'Game theory assumes two things about every player before it predicts anything.',
  short:'Players are rational, and everyone knows it.',tag:'assume',
  partsTitle:'In Sharma’s room',
  parts:[['Rational','Each player tries to get the most of something. Ravi and Meera want the fewest years. <strong>Rational doesn’t mean emotionless.</strong>'],['Common knowledge','Both are rational, both know it, and each knows the other knows it. Meera reads the same deal sheet, and knows you’re reading it.'],['Why it matters','A class WhatsApp group shows everyone the same message, with everyone’s blue ticks. Now each of you knows that all the others know.']],
  rule:'Knowing isn’t enough. <strong>Each side has to know that the other side knows.</strong>',
  check:{q:'Your teacher moves the exam to Monday. Which way of telling the class makes it <strong>common knowledge</strong>?',hint:'Who knows that the others know?',
   opts:[{t:'A message in the class group, where everyone sees everyone’s blue ticks',ok:true},{t:'A private message to each student'}],
   right:'Right. In the group, you know everyone saw it, and they know you saw it. Private messages tell everyone, but nobody knows who else knows.',
   wrong:'With private messages, everyone knows, but nobody knows who else knows. In the group, everyone sees everyone’s ticks. That is common knowledge.'},
  retry:{q:'Priya takes a smaller flat, far from college, to save ₹4,000 a month for a trip. Is she being rational?',hint:'Rational means getting the most of what she cares about.',
   opts:[{t:'Yes',ok:true},{t:'No, she should take the better flat'}],
   right:'Right. She’s getting the most of what she cares about: the trip. Rational is about her goal, not yours.',
   wrong:'Rational doesn’t mean picking what you would pick. Priya is getting the most of what she cares about, the trip. That is rational.'},
  btn:'Read the deal'},
 {ch:1,id:'deal',type:'deal'},
 {ch:1,id:'l_dom',type:'learn',n:3,of:8,term:'Dominant strategy',tag:'dominant',
  def:'A move that is best for you <strong>whatever the other player does</strong>.',
  short:'Best whatever the other does. Play it.',
  partsTitle:'How to find it',numbered:true,
  parts:[['Fix their move','Pick your best reply to it'],['Repeat','Do it for every move they could make'],['Compare','Same answer every time? That move is dominant. For Ravi: talk.']],

/* ---------- binary play (prison, ads) ---------- */
function renderPlay(st){
  const G=GAMES[st.g];
  const prog=S.prog[st.id]||st.nights.map(n=>n.me);
  const multi=st.nights.length>1;const guess=st.predict?(S.prog[st.id+':g']||null):null;
  const rows=st.nights.map((n,k)=>{
    const me=prog[k];
    const meCell=(st.locked||st.predict)?`<span class="chip lock">${G.chip[me]}</span>`:(me?`<button class="chip" data-row="${k}" data-act="unset" aria-label="Remove ${G.chip[me].replace(/<[^>]+>/g,"")}">${G.chip[me]}</button>`:`<span class="slot" data-row="${k}" role="img" aria-label="Empty slot"></span>`);
    const herCell=n.her==='copy'?`<span class="qm">copies ${G.turn} ${k}</span>`:`<span class="chip lock">${G.chip[n.her]}</span>`;
    return `<div class="row" id="r${k}a"><span class="n">${multi?('Night '+(k+1)):'1'}</span><span class="who">${G.you}</span>${meCell}</div>`+
           `<div class="row" id="r${k}b"><span class="n">${multi?'':'2'}</span><span class="who">${G.her}</span>${herCell}</div>`;
  }).join('')+(st.predict?`<div class="row" id="rg"><span class="n">?</span><span class="who">Guess</span>${guess?`<button class="chip" data-act="unguess" aria-label="Remove guess">${st.predict.options[guess]}</button>`:'<span class="slot" role="img" aria-label="Empty slot"></span>'}</div>`:'');
  const full=st.predict?!!guess:prog.every(Boolean);
  const pal=st.locked?'':st.predict?`<div class="palette">${Object.entries(st.predict.options).map(([k,v])=>`<button class="chip" data-guess="${k}">${v}</button>`).join('')}</div>`
    :`<div class="palette"><button class="chip" data-pal="${G.a}">${G.chip[G.a]}</button><button class="chip" data-pal="${G.b}">${G.chip[G.b]}</button></div>`;
  app.innerHTML=topbar()+`<h1 class="prompt">${st.prompt}</h1>
  <div class="stage"><div class="okstrip" id="okstrip"></div><div class="hd"><span class="st">${st.goalText}</span><span class="tag">${st.tag[0]}<small>${st.tag[1].toUpperCase()}</small></span></div>
   <div class="world"><div class="rooms">${G.card('A',null,null,null)}${G.card('B',null,null,null)}</div>${multi?`<div class="total" id="total">${G.total([0,0])}</div>`:''}</div>
   <div class="prog">${rows}</div></div>${pal}
  <div class="foot"><div class="nrow">${fox()}${nudge(st.nudge)}</div><div class="brow"><button class="btn" id="run" ${full?'':'disabled'}>Play the ${multi?G.turns:G.turn}</button></div></div>`;
  app.classList.remove('glow');
  app.querySelectorAll('[data-pal]').forEach(c=>c.onclick=()=>{const k=prog.findIndex(v=>!v);if(k<0)return;prog[k]=c.dataset.pal;S.prog[st.id]=prog;save();renderPlay(st);});
  app.querySelectorAll('[data-act=unset]').forEach(c=>c.onclick=()=>{prog[c.dataset.row]=null;S.prog[st.id]=prog;save();renderPlay(st);});
  app.querySelectorAll('[data-guess]').forEach(c=>c.onclick=()=>{S.prog[st.id+':g']=c.dataset.guess;save();renderPlay(st);});
  app.querySelectorAll('[data-act=unguess]').forEach(c=>c.onclick=()=>{S.prog[st.id+':g']=null;save();renderPlay(st);});
  document.getElementById('run').onclick=()=>runPlay(st,prog,guess);
}
async function runPlay(st,prog,guess){
  const G=GAMES[st.g];
  const btn=document.getElementById('run');btn.disabled=true;btn.textContent='Playing…';
  app.querySelectorAll('.palette .chip').forEach(c=>c.style.visibility='hidden');
  let tot=[0,0],prev=null;
  for(let k=0;k<st.nights.length;k++){
    const me=prog[k];const her=st.nights[k].her==='copy'?prev:st.nights[k].her;
    const ra=document.getElementById(`r${k}a`),rb=document.getElementById(`r${k}b`);
    ra.classList.add('cur');ra.querySelector('.n').textContent='▶';document.getElementById('room-A').classList.add('lit');
    const bA=document.getElementById('bub-A');bA.innerHTML=G.chip[me];bA.classList.add('on');G.react('A',me,null);
    await sleep(650);
    ra.classList.remove('cur');ra.querySelector('.n').innerHTML='<span class="tick"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';document.getElementById('room-A').classList.remove('lit');
    rb.classList.add('cur');rb.querySelector('.n').textContent='▶';
    if(st.nights[k].her==='copy'){rb.querySelector('.qm').outerHTML=`<span class="chip lock">${G.chip[her]}</span>`;}
    document.getElementById('room-B').classList.add('lit');
    const bB=document.getElementById('bub-B');bB.innerHTML=G.chip[her];bB.classList.add('on');G.react('B',null,her);
    await sleep(650);
    rb.classList.remove('cur');rb.querySelector('.n').innerHTML='<span class="tick"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';document.getElementById('room-B').classList.remove('lit');
    const p=G.pay[me+'|'+her];tot[0]+=p[0];tot[1]+=p[1];
    G.react('A',me,her);G.react('B',me,her);
    document.getElementById('yrs-A').innerHTML=G.fmt(p[0]);document.getElementById('yrs-B').innerHTML=G.fmt(p[1]);
    const t=document.getElementById('total');if(t)t.innerHTML=G.total(tot);
    await sleep(900);bA.classList.remove('on');bB.classList.remove('on');prev=me;
  }
  const res={me:tot[0],her:tot[1],guess};
  const ok=!st.goal||st.goal(res);
  const foot=app.querySelector('.foot');
  if(ok)succeed(st,foot,st.done,st.doneNudge,st.why);
  else fail(st,foot,st.missNudge||(st.goalText+'? Not yet.'),()=>{S.prog[st.id]=st.nights.map(n=>st.predict?n.me:null);S.prog[st.id+':g']=null;save();renderPlay(st);});
}

/* ---------- night by night (chapter 1): one choice a night, consequences carry ---------- */
function nightsState(st){
  let r=S.prog[st.id];
  if(!r||!Array.isArray(r.me)){
    let first=st.first;
    if(first&&first.from){const p=S.prog[first.from];first=(p&&p.me&&p.me.length)?p.me[p.me.length-1]:'silent';}
    r={me:[],her:[],first:first||'silent',sel:null,shown:false};S.prog[st.id]=r;save();
  }
  return r;
}
function herMove(r,k){return k===0?r.first:r.me[k-1];}
function nightLine(G,me,her){
  if(me==='talk'&&her==='silent')return 'Your charge was dropped. Meera took five, and she heard about it this morning.';
  if(me==='silent'&&her==='silent')return 'One year each. Nobody gave anything away.';
  if(me==='silent'&&her==='talk')return 'She talked. Five years for you, none for her.';
  return 'You both talked. Three years each.';
}
function totals(G,r){let t=[0,0];r.me.forEach((m,k)=>{const p=G.pay[m+'|'+r.her[k]];t[0]+=p[0];t[1]+=p[1];});return t;}
function renderNights(st){
  const G=GAMES[st.g];const r=nightsState(st);const k=r.me.length;const N=st.n;
  const done=k>=N;const tot=totals(G,r);
  const lastMe=k?r.me[k-1]:null,lastHer=k?r.her[k-1]:null;
  r.n1=N===1;const hist=histNights(G,r);
  let prompt;
  if(done)prompt=N===1?`The night is over.`:`${st.title}: done. <strong>${tot[0]}</strong> ${tot[0]===1?'year':'years'} for you.`;
  else if(N===1)prompt=`<strong>Tonight.</strong> Meera is next door, reading the same sheet. Stay silent, or talk?`;
  else if(k===0)prompt=st.lead?`<strong>Night 1 of ${N}.</strong> Fewest years wins. Best possible from here: <strong>${r.first==='talk'?8:4} years</strong>.`:`<strong>Night 1 of ${N}.</strong> Meera is next door. Stay silent, or talk?`;
  else if(k===N-1)prompt=`<strong>Night ${N} of ${N}. The last one.</strong> After tonight, no more questions. Stay silent, or talk?`;
  else prompt=`<strong>Night ${k+1} of ${N}.</strong> This morning Meera heard what you said last night. Stay silent, or talk?`;
  const coach=st.coach&&k===0;
  const pal=done?'':`<div class="palette ${coach&&!r.sel?'coach':''}">${coach&&!r.sel?'<div class="coachtip">Tap one to choose Ravi’s answer</div>':''}<button class="chip ${r.sel==='silent'?'sel':''}" data-pick="silent">${G.chip.silent}</button><button class="chip ${r.sel==='talk'?'sel':''}" data-pick="talk">${G.chip.talk}</button></div>`;
  const say=done?'':coach?(r.sel?'Good. Now play the night and see what Meera said.':''):k===0?(st.lead?(r.first==='talk'?'She opens with a talk tonight, because your last answer was a talk.':'She opens silent, because your last answer was silent.'):'Pick your answer. You will see hers in the morning.'):nightLine(G,lastMe,lastHer);
  app.innerHTML=topbar()+`<h1 class="prompt">${prompt}</h1>
  <div class="stage"><div class="hd"><span class="st">${st.title}</span><span class="tag">${done?(N===1?'1 night':N+' nights'):(N===1?'Tonight':'Night '+(k+1))}${N===1?'':`<small>${st.tag.toUpperCase()}</small>`}</span></div>
   <div class="world"><div class="rooms">${G.card('A',lastMe,lastHer,k?G.pay[lastMe+'|'+lastHer][0]:null)}${G.card('B',lastMe,lastHer,k?G.pay[lastMe+'|'+lastHer][1]:null)}</div><div class="total" id="total">${G.total(tot)}</div></div>
   ${hist}</div>
  <div class="foot">${pal}<div class="nrow">${fox(done?'thinking':'waiting')}${nudge(say)}</div><div class="brow">${done?'':`<button class="btn ${coach&&r.sel?'pulse':''}" id="run" ${r.sel?'':'disabled'}>${N===1?'Play the night':'Play night '+(k+1)}</button>`}</div></div>`;
  app.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{r.sel=c.dataset.pick;save();renderNights(st);});
  if(done){nightsSummary(st,r,tot);return;}
  document.getElementById('run').onclick=()=>playNight(st,r);
}
async function playNight(st,r){
  const G=GAMES[st.g];const k=r.me.length;const me=r.sel;const her=herMove(r,k);
  const btn=document.getElementById('run');btn.disabled=true;btn.textContent='Night falls…';
  app.querySelectorAll('.palette .chip').forEach(c=>c.style.visibility='hidden');
  document.getElementById('room-A').classList.add('lit');
  const bA=document.getElementById('bub-A');bA.innerHTML=G.chip[me];bA.classList.add('on');G.react('A',me,null);
  await sleep(750);document.getElementById('room-A').classList.remove('lit');document.getElementById('room-B').classList.add('lit');
  const bB=document.getElementById('bub-B');bB.innerHTML=G.chip[her];bB.classList.add('on');G.react('B',null,her);
  await sleep(750);document.getElementById('room-B').classList.remove('lit');
  const p=G.pay[me+'|'+her];G.react('A',me,her);G.react('B',me,her);
  document.getElementById('yrs-A').innerHTML=G.fmt(p[0]);document.getElementById('yrs-B').innerHTML=G.fmt(p[1]);
  r.me.push(me);r.her.push(her);r.sel=null;
  const t=totals(G,r);document.getElementById('total').innerHTML=G.total(t);
  addXp(10);save();
  await sleep(1100);
  renderNights(st);
}
function yrs(n){return n===0?'walks free':n+(n===1?' year':' years');}
function histNights(G,r){
  if(!r.me.length)return '';
  const rows=r.me.map((m,i)=>{const h=r.her[i];const p=G.pay[m+'|'+h];
    const fa=A['ravi_'+G.faceA(m,h)],fb=A['meera_'+G.faceB(m,h)];
    const said=x=>x==='talk'?'talked':'stayed silent';
    return `<div class="hrow"><span class="hn">${r.n1?'Tonight':'Night '+(i+1)}</span>
      <span class="hc"><img src="${fa}" alt=""><div><b class="${m==='talk'?'bad':''}">${said(m)}</b><em>${yrs(p[0])}</em></div></span>
      <span class="hc"><img src="${fb}" alt=""><div><b class="${h==='talk'?'bad':''}">${said(h)}</b><em>${yrs(p[1])}</em></div></span></div>`;}).join('');
  return `<div class="hist"><div class="hrow hh"><span></span><span>Ravi (you)</span><span>Meera</span></div>${rows}</div>`;
}
function talkNights(r){return r.me.map((m,i)=>m==='talk'?i+1:0).filter(Boolean);}
function nightsSummary(st,r,tot){
  const N=st.n;const y=tot[0];const tn=talkNights(r);let line;
  if(st.id==='night1'){
    const me=r.me[0];
    const line=me==='talk'?'You broke the promise. So did she. Three years each.':'You kept the promise. She didn’t. Five years for you, and she walks out free.';
    sheet(me==='talk'?'ok':'bad',`${y} ${y===1?'year':'years'} for you.`,line,`<button class="btn go" id="cont">Continue</button>`);
    if(me!=='talk')S.miss.dominant=1;
    if(!S.done[st.id]){S.done[st.id]=true;addXp(me==='talk'?25:10);}
    document.getElementById('cont').onclick=()=>{closeSheet();next();};return;
  }
  if(st.id==='run3'){
    const best=2;
    line=y===best?'You held while she could still answer you, and talked on the one night she couldn’t.'
      :!tn.length?'You never talked, and neither did she. One year a night.'
      :tn[0]<N?`You talked on night ${tn[0]}. The next night, she talked back.`
      :'You talked on the last night only.';
    sheet(y<=2?'ok':'bad',`Three nights. ${y} ${y===1?'year':'years'} for you.`,line,
      `<button class="link" id="why">Why?</button><button class="btn go" id="cont">Continue</button>`);
    document.getElementById('why').onclick=()=>openWhy('Each morning Meera answered with whatever you said the night before. Talk on night 1 and she talks on night 2. Stay silent and she stays silent. Only the last night has no morning after it, so a talk there is never answered. Best total: <code>1 + 1 + 0 = 2</code>.');
  }else{
    const prev=S.prog[st.first.from]||{me:[]};const ptn=talkNights(prev);
    const first=r.her[0];
    const lst=a=>a.length===1?a[0]:a.slice(0,-1).join(', ')+' and '+a[a.length-1];
    const bestL=first==='talk'?8:4;
    const then=tn.length?`You talked on night${tn.length>1?'s':''} ${lst(tn)}.`:'You never talked.';
    const open=first==='talk'?' She opened with a talk, because you talked on the robbery night.':'';
    const now=y<=bestL?' That is the best possible from where you started.':` The best possible from where you started was ${bestL} years.`;
    const how=y<=bestL?'':first==='talk'?' What works: stay silent from night 1, even though she talks once, so she goes quiet too. Keep quiet through night 4. Talk only on night 5, when she can’t answer back.':' What works: stay silent on nights 1 to 4, so Meera stays silent too. Talk only on night 5, when she can’t answer back.';
    sheet(y<=bestL?'ok':'bad',`Five nights. ${y} ${y===1?'year':'years'} for you.`,then+open+now+how,
      y<=bestL?`<button class="link" id="why">Why?</button><button class="btn go" id="cont">Continue</button>`
      :`<button class="link" id="why">Why?</button><button class="btn ghost" id="cont">Continue</button><button class="btn try" id="again">Try for ${bestL} years</button>`);
    setTimeout(()=>window.scrollTo(0,document.documentElement.scrollHeight),450);
    if(y>bestL)document.getElementById('again').onclick=()=>{closeSheet();delete S.prog[st.id];save();render();};
    document.getElementById('why').onclick=()=>openWhy('Meera never forgot. She started these five nights with your answer from the first night. If that was a talk, the only way back to one year a night was to stay silent and take one bad night. Best from a clean start: <code>1 + 1 + 1 + 1 + 0 = 4</code>. Starting after a talk, the best is <code>5 + 1 + 1 + 1 + 0 = 8</code>.');
  }
  if(st.id==='loop'&&r.me.some((m,i)=>m==='talk'&&i<N-1))S.miss.tomorrow=1;
  if(!S.done[st.id]){S.done[st.id]=true;const bst=st.id==='run3'?2:(r.her[0]==='talk'?8:4);addXp(y<=bst?25:10);}
  document.getElementById('cont').onclick=()=>{closeSheet();next();};
}

const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function jioInit(){return {b:{jio:0,...JIO.start},p:{air:249,vi:249,rc:249},cash:JIO.cash0,dead:false,broke:false,hist:[],sel:null};}
function jioState(st){let r=S.prog[st.id];if(!r||!r.b){r=jioInit();S.prog[st.id]=r;save();}return r;}
function jioStep(r,pj){
  const ev=[];const before=r.b.jio;const newvi=r.p.air;
  ['air','vi','rc'].forEach(k=>{if(k==='rc'&&r.dead)return;const rt=JIO.rate(r.p[k]-pj);const f=rt>0?r.b[k]*rt:r.b.jio*rt/3;r.b[k]-=f;r.b.jio+=f;});
  const income=r.b.jio*pj*0.3;r.cash+=income-JIO.cost;
  if(r.p.air===249&&r.b.air<JIO.start.air*0.9){r.p.air=149;ev.push('air');}
  if(r.p.vi!==newvi){r.p.vi=newvi;ev.push('vi');}
  if(!r.dead&&r.b.rc<JIO.start.rc*0.75){r.dead=true;r.b.jio+=r.b.rc/2;r.b.air+=r.b.rc/2;r.b.rc=0;ev.push('rc');}
  if(r.cash<=0)r.broke=true;
  r.hist.push({pj,jio:Math.round(r.b.jio),gain:Math.round(r.b.jio-before),cash:Math.round(r.cash),income:Math.round(income),ev});
}
const pLabel=p=>p===0?'Free':'₹'+p;
function netCard(k,r,pj){
  const N=NETS[k];const price=k==='jio'?pj:r.p[k];const cu=Math.round(r.b[k]);const dead=k==='rc'&&r.dead;
  const cls=price===0?'free':price===149?'cut':'';const w=Math.min(100,Math.round(cu/450*100));
  const lastH=r.hist[r.hist.length-1];const lost=lastH&&lastH.gain>0;const mood=dead?'gone':k==='jio'?null:(price===149?(lost?'worried':'grim'):(lost?'worried':'calm'));
  const logo=k==='vi'?VODA16:A[N.logo];
  return `<div class="nc ${dead?'dead':''}" id="nc-${k}">${k==='jio'?`<img src="${logo}" alt="">`:faceSvg(k==='air'?'airtel':k,mood)+`<img class="lg" src="${logo}" alt="">`}
   <div class="nm">${N.n}</div><span class="ptag ${cls}" id="pt-${k}">${price==null?'₹ ?':pLabel(price)}</span>
   <div class="cu">${dead?'<small class="mn">network shut</small>':`<b id="cu-${k}">${cu}</b><small class="mn">million</small>`}</div><div class="sh"><i id="sh-${k}" style="width:${w}%"></i></div>${dead?'<span class="shut">SHUT</span>':''}</div>`;
}
function market(r,pj){return `<div class="mkt">${['jio','air','vi','rc'].map(k=>netCard(k,r,pj)).join('')}</div>`;}
function cashBar(r){const w=clamp(r.cash/JIO.cash0*100,0,100);const m=r.cash<=0?'shock':r.cash<JIO.cash0*0.3?'worried':r.cash>JIO.cash0?'happy':'calm';return `<div class="cashw">${faceSvg('dev',m)}<span>Dev, finance<br>Cash</span><div class="cb"><i class="${r.cash<JIO.cash0*0.3?'low':''}" style="width:${w}%"></i></div><b>${r.cash<=0?'₹0':inr(r.cash)+' cr'}</b></div>`;}
const EVL={air:'Airtel lost a tenth of its customers and cut to ₹149.',vi:'Vodafone and Idea copied Airtel’s price.',rc:'Reliance Comm. could not afford to cut. It shut, and its customers split between you and Airtel.'};
function quarterLine(h){
  const money=h.pj===0?` Nothing came in, and the network cost ${inr(JIO.cost)} crore.`:` They paid ${inr(h.income)} crore; the network cost ${inr(JIO.cost)} crore.`;
  const move=h.gain<0?`Your price was above theirs. ${-h.gain} million left Jio.`:h.gain===0?'Same price as everyone. Nobody had a reason to switch.':h.pj===0?`Free pulled ${h.gain} million people across.`:`${h.gain} million more moved to Jio.`;
  return move+money+(h.ev.length?' '+h.ev.map(e=>EVL[e]).join(' '):'');
}
function renderJio(st){
  const r=jioState(st);const k=r.hist.length;const N=JQ.length;const done=k>=N||r.broke;const last=k?r.hist[k-1]:null;
  const forced=r.broke&&!done;
  const met=r.b.jio>=JIO.goal;
  const goal=`<div class="goal"><span class="${met?'met':done?'miss':''}">Goal: ${JIO.goal}M customers · now ${Math.round(r.b.jio)}M</span><span class="${r.broke?'miss':done?'met':''}">${r.broke?'Cash ran out':'Goal: never run out of cash'}</span></div>`;
  let prompt;
  if(done)prompt=r.broke?`The cash ran out in quarter ${k}. The board stopped the launch with <strong>${Math.round(r.b.jio)} million</strong> people on Jio.`:`Six quarters done. <strong>${Math.round(r.b.jio)} million</strong> people on Jio.`;
  else if(k===0)prompt=`<strong>Quarter 1 of ${N}</strong> · ${JQ[0]}. Everyone charges ₹249. Set Jio’s price.`;
  else if(forced)prompt=`<strong>Quarter ${k+1} of ${N}</strong> · ${JQ[k]}. Cash ran out. The board has set Jio at ₹249.`;
  else prompt=`<strong>Quarter ${k+1} of ${N}</strong> · ${JQ[k]}. Set Jio’s price.`;
  const hist=r.hist.map((h,i)=>`<div class="qrow"><span class="n">${JQ[i]}</span><span class="chip lock ${h.pj===0?'free':''}">${pLabel(h.pj)}</span><span class="ev">${h.ev.length?h.ev.map(e=>({air:'Airtel cut its price',vi:'Vodafone, Idea cut',rc:'Reliance Comm. shut'})[e]).join(' · '):''}</span><span class="num">${h.jio}M<br><small class="${h.income-JIO.cost<0?'neg':'pos'}">${h.income-JIO.cost<0?'−':'+'}${inr(Math.abs(h.income-JIO.cost))} cr</small></span></div>`).join('');
  const opts=forced?[249]:[0,149,249];
  if(forced)r.sel=249;
  const pal=done?'':`<div class="palette">${opts.map(p=>`<button class="chip ${p===0?'free':''} ${r.sel===p?'sel':''}" data-pick="${p}"><b>${p===0?'free':'₹'+p}</b>${p===0?'':' a month'}</button>`).join('')}</div>`;
  const say=done?'':k===0?'Customers move when your price is below theirs. The network costs ₹5,000 crore a quarter.':quarterLine(last);
  app.innerHTML=topbar()+`<h1 class="prompt">${prompt}</h1>${goal}
  <div class="stage"><div class="hd"><span class="st">${st.title}</span><span class="tag">${done?k+' quarters':'Quarter '+(k+1)}<small>${st.tag.toUpperCase()}</small></span></div>
   <div class="world">${market(r,r.sel!=null?r.sel:(last?last.pj:null))}${cashBar(r)}</div>
   ${hist?`<div class="prog">${hist}</div>`:''}</div>${pal}
  <div class="foot"><div class="nrow">${fox(done?'thinking':r.broke?'surprised':'waiting')}${nudge(say)}</div><div class="brow">${done?'':`<button class="btn" id="run" ${r.sel==null?'disabled':''}>Run quarter ${k+1}</button>`}</div></div>`;
  app.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{r.sel=+c.dataset.pick;save();renderJio(st);});
  if(done){jioSummary(st,r);return;}
  document.getElementById('run').onclick=()=>playQuarter(st,r);
}
async function playQuarter(st,r){
  const pj=r.sel;const btn=document.getElementById('run');btn.disabled=true;btn.textContent='Quarter running…';
  app.querySelectorAll('.palette .chip').forEach(c=>c.style.visibility='hidden');
  const nj=document.getElementById('nc-jio');nj.classList.add('lit');const pt=document.getElementById('pt-jio');pt.classList.add('bump');
  await sleep(700);nj.classList.remove('lit');pt.classList.remove('bump');
  jioStep(r,pj);r.sel=null;
  ['jio','air','vi','rc'].forEach(k=>{const c=document.getElementById('cu-'+k);if(c)c.textContent=Math.round(r.b[k]);const s=document.getElementById('sh-'+k);if(s)s.style.width=Math.min(100,Math.round(r.b[k]/420*100))+'%';});
  const h=r.hist[r.hist.length-1];
  for(const e of h.ev){const k=e;const el=document.getElementById('nc-'+k);if(!el)continue;el.classList.add('lit');const p=document.getElementById('pt-'+k);
    if(e==='rc'){el.classList.add('dead');}else if(p){p.textContent='₹149';p.classList.add('cut','bump');}
    await sleep(800);el.classList.remove('lit');if(p)p.classList.remove('bump');}
  addXp(10);save();await sleep(700);renderJio(st);
}
function jioSummary(st,r){
  const c=Math.round(r.b.jio);const ok=c>=JIO.goal&&!r.broke;const free=r.hist.filter(h=>h.pj===0).length;
  const all249=r.hist.every(h=>h.pj===249);const bq=r.hist.findIndex(h=>h.cash<=0)+1;
  const line=ok?`Free for ${free} ${free===1?'quarter':'quarters'}, then a price low enough that people stayed. Now look at what it did to Airtel.`
    :r.broke?`Cash ran out in quarter ${bq}. Free cost ₹5,000 crore a quarter with nothing coming in, and the board stopped the launch.`
    :all249?'Same price as everyone, every quarter. Nobody had a reason to switch.'
    :free===0?'You never went free. ₹149 moved some people until Airtel matched it, then the flow stopped.'
    :'You started charging before enough people had crossed. Once the others matched ₹149, nobody else moved.';
  sheet(ok?'ok':'bad',ok?`Goal met. ${c} million customers.`:`Goal missed. ${c} million customers.`,line,`<button class="link" id="why">Why?</button><button class="btn go" id="cont">Continue</button>`);
  document.getElementById('why').onclick=()=>openWhy('People moved by the size of the price gap. A <code>₹249</code> gap pulled 12% of a network’s customers in a quarter, <code>₹149</code> pulled 8%, <code>₹100</code> pulled 4%, and the same price pulled nobody. Each quarter the network cost <code>₹5,000 crore</code>; customers paid your price for three months. Free meant nothing came in. Airtel cut once it had lost a tenth of its customers, Vodafone and Idea copied Airtel a quarter later, and Reliance Comm. could not afford to cut at all. The numbers are simplified. The order of events is what happened.');
  if(!S.done[st.id]){S.done[st.id]=true;addXp(ok?25:10);}
  document.getElementById('cont').onclick=()=>{closeSheet();next();};
}

 {s:{jio:72,air:266,vi:392,rc:85},pj:0,ev:['air'],line:'Jio gives it all away <strong>free</strong>. Calls, data, everything. Airtel blinks first and cuts its price.'},
 {s:{jio:109,air:274,vi:405,rc:85},pj:0,ev:['vi'],line:'Still free. Jio crosses <strong>100 million</strong> people by February. Vodafone and Idea cut too, then decide to merge.'},
 {s:{jio:123,air:281,vi:408,rc:80},pj:149,ev:[],line:'Now Jio starts charging. But far below the old ₹249, so <strong>most people stay</strong>.'},
 {s:{jio:139,air:283,vi:407,rc:75},pj:149,ev:[],line:'Every network sells cheap data now. <strong>The old ₹249 world is gone.</strong>'},
 {s:{jio:160,air:290,vi:408,rc:0},pj:149,ev:['rc'],line:'Reliance Comm. can’t keep up. <strong>It shuts its mobile network.</strong>'},

function jioWatchStep(r,i){
  /* real subscriber counts (TRAI, millions, rounded); prices stay simplified */

  W.ev.forEach(e=>{if(e==='rc')r.dead=true;else r.p[e]=149;});
  r.b={...W.s};
  r.hist.push({pj:W.pj,jio:W.s.jio,gain:W.s.jio-before,cash:r.cash,income:0,ev:W.ev});
}
function renderJioWatch(st){
  let r=S.prog[st.id];if(!r||!r.b){r=jioInit();r.cash=JIO.cash0;S.prog[st.id]=r;save();}

  app.innerHTML=topbar()+`<h1 class="prompt jwh">${k?JQ[k-1]:'September 2016'}</h1><div class="goal"><span>Real subscriber counts · monthly prices simplified</span></div>
  <div class="stage"><div class="hd"><span class="st">${st.title}</span><span class="tag">${k?'Quarter '+k+' of '+N:'Launch'}<small>${st.tag.toUpperCase()}</small></span></div>
   <div class="world">${market(r,last?last.pj:null)}</div>
   ${hist?`<div class="prog">${hist}</div>`:''}</div>
  <div class="foot"><div class="nrow jwn">${fox(done?'thinking':'speaking')}${nudge('')}</div><div class="brow"><button class="btn ${done?'go':''}" id="run">${done?'Continue':k===0?'See what happened':'Next quarter'}</button></div></div>`;
  setTimeout(()=>{const f=document.getElementById('fox');if(f)f.classList.add('pop');setNudge(prompt);},250);
  app.querySelectorAll('.you-tag').forEach(e=>e.remove());app.querySelectorAll('.nc.you').forEach(e=>e.classList.remove('you'));

/* ---------- the table flip: dominant strategy ---------- */
const FLIP={before:{HH:150,HC:145,CH:140,CC:100},after:{HH:134,HC:60,CH:145,CC:95}};
const FLIPQ=[
 {t:'before',col:'H',q:'Before Jio. Vodafone and Idea <strong>hold</strong> at ₹249. What earns Airtel more?',a:'H'},
 {t:'before',col:'C',q:'Still before Jio. This time Vodafone and Idea <strong>cut</strong> to ₹149. What earns Airtel more?',a:'H'},
 {t:'after',col:'H',q:'Now Jio is free. Vodafone and Idea <strong>hold</strong>. What earns Airtel more?',a:'C'},
 {t:'after',col:'C',q:'Jio is still free. Vodafone and Idea <strong>cut</strong>. What earns Airtel more?',a:'C'}];
function flipRows(t,best,title){const T=FLIP[t];
  const row=c=>{const w=best,l=best==='H'?'C':'H',nm=x=>x==='H'?'holding':'cutting';return `<div class="dline"><span>If Vodafone and Idea ${c==='H'?'hold':'cut'}, <strong>${nm(w)}</strong> earns Airtel ₹${T[w+c]} crore, not ₹${T[l+c]} crore.</span></div>`;};
  return `<div class="fblock"><h4>${title}: ${best==='H'?'holding':'cutting'} wins both cases</h4>${row('H')}${row('C')}</div>`;}
function flipTable(t,col,pick,ans){
  const T=FLIP[t];const cell=(row,c)=>{const v=T[row+c];const on=col==='both'||c===col;const cls=['c'];if(!on)cls.push('dimc');if(on&&ans&&row===ans)cls.push('hi');if(on&&pick&&row===pick&&pick!==ans)cls.push('pick');return `<div class="${cls.join(' ')}">₹${v} cr</div>`;};
  return `<div class="gridw"><div class="pm"><div class="h"></div><div class="h">They hold</div><div class="h">They cut</div>
   <div class="h">Airtel holds</div>${cell('H','H')}${cell('H','C')}<div class="h">Airtel cuts</div>${cell('C','H')}${cell('C','C')}</div></div>`;
}
function renderFlip(st){
  let r=S.prog[st.id];if(!r||!Array.isArray(r.picks)){r={picks:[]};S.prog[st.id]=r;save();}
  const k=FLIPQ.length;
  if(k>=FLIPQ.length){
    app.innerHTML=topbar()+`<div class="concept fade"><p class="caseq">A simple model · made-up numbers</p><h1 class="lead">In this model, before Jio, holding the price paid Airtel more, whatever Vodafone and Idea did. After Jio, cutting did.</h1>
     ${flipRows('before','H','Before Jio')}${flipRows('after','C','After Jio')}
     </div>
     <div class="foot"><div class="nrow">${fox('speaking')}${nudge('Made-up profit numbers, in crore, to show the idea. Same company, same rivals: Jio changed which move wins.')}</div><div class="brow"><button class="btn" id="cont">Continue</button></div></div>`;
    document.getElementById('cont').onclick=next;return;
  }
  const Q=FLIPQ[k];const answered=r.cur!=null;
  const right=answered&&r.cur===Q.a;
  const say=!answered?(k===0?'Each cell is Airtel’s profit for one quarter, in crore, for one pair of moves.':'Look only at the lit column.')
    :right?(k===1?'Hold wins both times. Holding was Airtel’s safe move, whatever the others did.':k===3?'Cut wins both times now. Same company, same rivals, new table.':'Right.')
    :`Not that one. ${Q.a==='H'?'Holding':'Cutting'} earns ₹${FLIP[Q.t][Q.a+Q.col]} crore here, against ₹${FLIP[Q.t][(Q.a==='H'?'C':'H')+Q.col]} crore.`;
  app.innerHTML=topbar()+`<h1 class="prompt">${Q.q}</h1>
   <div class="stage"><div class="hd"><span class="st">${Q.t==='before'?'Before Jio':'After Jio'}</span><span class="tag">${k+1} of 4<small>AIRTEL’S PROFIT, ₹ CRORE</small></span></div>${flipTable(Q.t,Q.col,answered?r.cur:null,answered?Q.a:null)}</div>
   <div class="ask">${answered?'':`<button class="chip" data-a="H"><b>hold</b> ₹249</button><button class="chip cutc" data-a="C"><b>cut</b> to ₹149</button>`}</div>
   <div class="foot"><div class="nrow">${fox(answered?(right?'celebrating':'thinking'):'waiting')}${nudge(say)}</div><div class="brow">${answered?'<button class="btn" id="cont">Continue</button>':''}</div></div>`;
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{r.cur=b.dataset.a;if(r.cur===Q.a)addXp(5);save();renderFlip(st);});
  if(answered)document.getElementById('cont').onclick=()=>{r.picks.push(r.cur);r.cur=null;save();renderFlip(st);};
}

/* ---------- switch seats: you are Airtel ---------- */
const SEAT={pay:{'H|H':[134,134],'H|C':[60,145],'C|H':[145,60],'C|C':[95,95]},chip:{H:'<b>hold</b> ₹249',C:'<b>cut</b> to ₹149'}};
function seatMood(v){return v==null?'calm':v>=145?'happy':v>=134?'calm':v>=95?'grim':'worried';}
function seatCard(side,me,val){const k=side==='A'?'air':'vi';const N=NETS[k];

   <div class="stage"><div class="hd"><span class="st">${st.title}</span><span class="tag">${done?N+' quarters':'Quarter '+(k+1)}<small>${st.tag.toUpperCase()}</small></span></div>
    <div class="world"><div class="rooms">${seatCard('A',null,last?last[0]:null)}${seatCard('B',null,last?last[1]:null)}</div><div class="total" id="total">Airtel so far <b>₹${tot}</b> cr</div></div>
    ${hist?`<div class="prog">${hist}</div>`:''}</div>${pal}
   <div class="foot"><div class="nrow">${fox(done?'thinking':'waiting')}${nudge(say)}</div><div class="brow">${done?'':`<button class="btn" id="run" ${r.sel?'':'disabled'}>Run quarter ${k+1}</button>`}</div></div>`;
  app.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{r.sel=c.dataset.pick;save();renderSeat(st);});
  if(done){seatSummary(st,r,tot);return;}
  document.getElementById('run').onclick=async()=>{
    const me=r.sel,her=k===0?'H':'C';const btn=document.getElementById('run');btn.disabled=true;btn.textContent='Quarter running…';
    app.querySelectorAll('.palette .chip').forEach(c=>c.style.visibility='hidden');
    const a=document.getElementById('room-A');a.classList.add('lit');const bA=document.getElementById('bub-A');bA.innerHTML=SEAT.chip[me];bA.classList.add('on');
    await sleep(700);a.classList.remove('lit');const b=document.getElementById('room-B');b.classList.add('lit');const bB=document.getElementById('bub-B');bB.innerHTML=SEAT.chip[her];bB.classList.add('on');
    await sleep(700);b.classList.remove('lit');const p=SEAT.pay[me+'|'+her];
    document.getElementById('yrs-A').innerHTML='<b>₹'+p[0]+'</b> cr';document.getElementById('yrs-B').innerHTML='<b>₹'+p[1]+'</b> cr';document.getElementById('face-A').innerHTML=faceSvg('airtel',seatMood(p[0]));document.getElementById('face-B').innerHTML=faceSvg('vi',seatMood(p[1]));
    r.me.push(me);r.her.push(her);r.sel=null;addXp(10);save();await sleep(1000);renderSeat(st);};
}
function seatSummary(st,r,tot){
  const best=145+95*(st.n-1);const ok=tot>=best;const held=r.me.filter(m=>m==='H').length;
  sheet(ok?'ok':'bad',`₹${tot} crore as Airtel.`,ok?'You cut because you had to, and so did they. Nobody chose a price war. The table chose it.'
    :`You held for ${held} ${held===1?'quarter':'quarters'}. ${held===1?'That quarter':'Each time'}, cutting would have earned more, whatever they did.`,
    `<button class="link" id="why">Why?</button><button class="btn go" id="cont">Continue</button>`);
  document.getElementById('why').onclick=()=>openWhy(`With Jio in the market, cutting beat holding in both columns: <code>₹145</code> against ₹134 when they held, <code>₹95</code> against ₹60 when they cut. Vodafone and Idea held for one quarter, then cut for good. Best total: <code>145 + 95 + 95 + 95 = ${best}</code>. Before Jio, both holding paid ₹150 a quarter each. That world was gone.`);
  if(!S.done[st.id]){S.done[st.id]=true;addXp(ok?25:10);}
  document.getElementById('cont').onclick=()=>{closeSheet();next();};
}

/* ---------- where else: one tap, one answer ---------- */
function renderWhere(st){

  app.innerHTML=topbar()+`<div class="concept"><p class="caseq">Where else</p><h1 class="lead">${st.q}</h1>
   <div class="opts">${st.opts.map((o,i)=>`<button class="opt ${pick===i?'on':''}" data-i="${i}" ${pick!=null?'disabled':''}>${o.t}</button>${pick===i?`<div class="ans fade">${o.a}</div>`:''}`).join('')}</div></div>
   <div class="foot"><div class="nrow">${fox(pick==null?'thinking':'speaking')}${nudge(pick==null?'Pick the one you know best.':st.say)}</div><div class="brow"><button class="btn" id="cont" ${pick==null?'disabled':''}>Continue</button></div></div>`;
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.prog[st.id]=+b.dataset.i;addXp(5);save();renderWhere(st);});
  document.getElementById('cont').onclick=next;
}
