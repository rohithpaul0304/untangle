<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New deck</title>
<style>
:root{--bg:#ffffff;--ink:#1f2d36;--muted:#6b7a85;--line:#e1e8ee;--accent:#2f8fdd;--accent-dark:#1f6fb0;--warm:#ffcf4d;--good:#2fb36a;--radius:18px;--guide:140px}
*{box-sizing:border-box}
html,body{margin:0;background:#eef2f5;color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.phone{max-width:430px;min-height:100svh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--line)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
header .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.progress{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
header button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;color:var(--muted);cursor:pointer}
main{flex:1;display:flex;flex-direction:column;padding:16px 16px 0}
.stage{flex:1;display:flex;flex-direction:column;gap:14px}
.visual{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:#fff;animation:rise .35s ease both}
.visual.empty{display:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.counters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.counter{flex:1 1 90px;text-align:center;border-radius:14px;padding:10px 8px;background:#f6f9fb}
.counter b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.counter span{font-size:13px;color:var(--muted)}
.counter.changed b{color:var(--accent-dark)}
.people{display:flex;flex-direction:column;gap:10px}
.group{display:flex;align-items:center;gap:10px}
.group .label{width:72px;font-size:13px;color:var(--muted)}
.group .row{display:flex;gap:4px;flex-wrap:wrap}
.person{width:14px;height:26px;border-radius:5px;background:linear-gradient(transparent 10px,var(--c,#3a9bd4) 10px);position:relative}
.person:before{content:"";position:absolute;top:0;left:2.5px;width:9px;height:9px;border-radius:50%;background:var(--c,#3a9bd4)}
.cards{display:grid;gap:10px}
.card{border:2px solid var(--line);border-radius:14px;padding:12px}
.card.selected{border-color:var(--accent);background:#f2f8fd}
.card h4{margin:0 0 4px;font-size:16px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.column{background:#f6f9fb;border-radius:14px;padding:10px;min-height:90px}
.column h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.column .item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:6px}
.column .ghost{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.message{display:flex;flex-direction:column;gap:4px}
.message .from{font-size:12px;color:var(--muted);font-weight:600}
.message .text{background:#f1f5f8;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:16px}
.concept{border:2px solid var(--warm);background:#fff9e3;border-radius:14px;padding:14px}
.concept h3{margin:0 0 6px;font-size:22px}
.concept p{margin:0;font-size:16px}
.image img{max-width:100%;border-radius:12px;display:block}
.caption{font-size:13px;color:var(--muted);margin-top:8px}
.guide{display:flex;align-items:flex-end;gap:12px;margin-top:auto;padding:12px 0 8px}
.guide .char{width:var(--guide);height:var(--guide);flex:none;display:flex;align-items:flex-end;justify-content:center}
.guide .char img,.guide .char svg{max-width:100%;max-height:100%;object-fit:contain}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:18px;line-height:1.4;animation:rise .3s ease both}
.bubble:focus{outline:none}
.bubble:before{content:"";position:absolute;left:-12px;bottom:22px;border:7px solid transparent;border-right:9px solid var(--line)}
.bubble:after{content:"";position:absolute;left:-8px;bottom:23px;border:6px solid transparent;border-right:8px solid #fff}
.actions{padding:12px 16px 20px;display:grid;gap:10px;border-top:1px solid var(--line);background:#fff}
.actions.hidden{visibility:hidden}
button.choice{font:inherit;font-size:17px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;min-height:48px}
button.choice:hover{border-color:#c9d6e0}
button.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.choice.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dark);text-align:center}
textarea.reflect{font:inherit;font-size:16px;width:100%;min-height:72px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical}
.summary{font-size:14px;color:var(--muted)}
.summary code{font-size:12px;display:block;white-space:pre-wrap;background:#f6f9fb;border-radius:10px;padding:10px;margin-top:8px;max-height:160px;overflow:auto}
.sceneid{position:absolute;top:50px;right:12px;font-size:11px;color:#b0bcc6;font-family:ui-monospace,Menlo,monospace}
.authornote{font-size:13px;color:#8a5a00;background:#fff7df;border:1px dashed #e7c66a;border-radius:10px;padding:8px 10px}
.menu{position:absolute;inset:0;background:rgba(31,45,54,.5);display:none;align-items:flex-end}
.menu.open{display:flex}
.menu .sheet{background:#fff;width:100%;max-height:70%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.menu .sheet button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;padding:10px;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
.status{font-size:12px;color:var(--muted);padding:0 16px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <header>
    <span class="title" id="title"></span>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <span id="taps" aria-label="taps so far">0</span>
    <button id="restart" type="button">Start over</button>
    <button id="scenesBtn" type="button" hidden>Scenes</button>
  </header>
  <div class="sceneid" id="sceneid" hidden></div>
  <main>
    <div class="stage">
      <div class="visual empty" id="visual"></div>
      <div class="guide">
        <div class="char" id="char" aria-hidden="true"></div>
        <div class="bubble" id="bubble" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <div class="actions" id="actions"></div>
  <div class="status" id="status"></div>
  <div class="menu" id="menu"><div class="sheet" id="sheet"></div></div>
</div>

<script>
(function(){
  'use strict';
  const DECK = JSON.parse(document.getElementById('deck').textContent);
  const CHAR = JSON.parse(document.getElementById('character').textContent);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const author = new URLSearchParams(location.search).get('author') === '1';
  const $ = id => document.getElementById(id);
  const state = {vars:{}, taps:0, decisions:0, log:[], visited:[], current:null, prevCounters:null, t0:Date.now()};

  const SCENES = DECK.scenes || {};
  const total = Object.keys(SCENES).length || 1;
  document.title = (DECK.meta && DECK.meta.title) || document.title;
  $('title').textContent = (DECK.meta && DECK.meta.title) || '';
  $('status').textContent = DECK.meta ? ['Status: ' + (DECK.meta.status || 'Draft'), DECK.meta.candidate ? 'Candidate ' + DECK.meta.candidate : '', DECK.meta.lens ? 'Lens: ' + DECK.meta.lens : ''].filter(Boolean).join(' · ') : '';

  const COND = /^([\w.-]+)\s*(=|!=)\s*(.+)$/;
  function cond(obj){
    if(typeof obj !== 'object' || obj === null || Array.isArray(obj)) return obj;
    const keys = Object.keys(obj);
    if(!keys.some(k => k === 'default' || COND.test(k))) return obj; // a plain object, not a condition map
    for(const k of keys){
      if(k === 'default') continue;
      const m = k.match(COND);
      if(!m) continue;
      const v = String(state.vars[m[1]]);
      if((m[2] === '=' && v === m[3]) || (m[2] === '!=' && v !== m[3])) return obj[k];
    }
    return obj.default;
  }
  function tpl(s){ return String(s == null ? '' : s).replace(/\{\{\s*([\w.-]+)\s*\}\}/g, (_,k)=> state.vars[k] == null ? '' : state.vars[k]); }

  function setChar(mood){
    const el = $('char'); el.innerHTML = '';
    const m = mood || 'waiting';
    if(CHAR.images && CHAR.images[m]){ const img = document.createElement('img'); img.src = CHAR.images[m]; img.alt = ''; el.appendChild(img); }
    else if(CHAR.images && CHAR.images.waiting){ const img = document.createElement('img'); img.src = CHAR.images.waiting; img.alt=''; el.appendChild(img); }
    else if(CHAR.svg && (CHAR.svg[m] || CHAR.svg.waiting)){ el.innerHTML = CHAR.svg[m] || CHAR.svg.waiting; }
  }

  function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

  function renderVisual(v){
    const box = $('visual'); box.innerHTML = ''; box.className = 'visual empty';
    if(!v) return;
    v = cond(v); if(!v) return;
    box.className = 'visual v-' + (v.type || 'none');
    if(v.type === 'counters'){
      const wrap = el('div','counters');
      (v.items || []).forEach(it => {
        const c = el('div','counter'); const b = el('b'); const s = el('span', null, tpl(it.label));
        const from = (state.prevCounters && state.prevCounters[it.label] != null) ? state.prevCounters[it.label] : (it.from != null ? it.from : it.value);
        c.appendChild(b); c.appendChild(s); wrap.appendChild(c);
        animateNumber(b, Number(from), Number(it.value), it.suffix || '');
        if(Number(from) !== Number(it.value)) c.classList.add('changed');
      });
      box.appendChild(wrap);
      state.prevCounters = {}; (v.items || []).forEach(it => state.prevCounters[it.label] = Number(it.value));
    } else if(v.type === 'people'){
      const wrap = el('div','people');
      (v.groups || []).forEach(g => {
        const row = el('div','group'); row.appendChild(el('span','label', tpl(g.label)));
        const r = el('div','row'); for(let i=0;i<(g.count||0);i++){ const p = el('i','person'); if(g.color) p.style.setProperty('--c', g.color); r.appendChild(p); }
        row.appendChild(r); wrap.appendChild(row);
      });
      box.appendChild(wrap);
    } else if(v.type === 'cards'){
      const wrap = el('div','cards');
      (v.items || []).forEach(it => { const c = el('div','card' + (it.selected ? ' selected' : '')); c.appendChild(el('h4', null, tpl(it.title))); (it.lines || []).forEach(l => c.appendChild(el('p', null, tpl(l)))); wrap.appendChild(c); });
      box.appendChild(wrap);
    } else if(v.type === 'board'){
      const wrap = el('div','board');
      (v.columns || []).forEach(col => { const c = el('div','column'); c.appendChild(el('h4', null, tpl(col.title))); if(!(col.items||[]).length) c.appendChild(el('div','ghost', col.empty || 'Empty')); (col.items || []).forEach(i => c.appendChild(el('div','item', tpl(i)))); wrap.appendChild(c); });
      box.appendChild(wrap);
    } else if(v.type === 'message'){
      const m = el('div','message'); m.appendChild(el('div','from', tpl(v.from))); m.appendChild(el('div','text', tpl(v.text))); box.appendChild(m);
    } else if(v.type === 'concept'){
      const c = el('div','concept'); c.appendChild(el('h3', null, tpl(v.name))); c.appendChild(el('p', null, tpl(v.definition))); box.appendChild(c);
    } else if(v.type === 'image'){
      const img = document.createElement('img'); img.src = v.src; img.alt = v.alt || ''; box.appendChild(img);
    } else if(v.type === 'text'){
      box.appendChild(el('div', null, tpl(v.text)));
    } else { box.className = 'visual empty'; }
    if(v.caption) box.appendChild(el('div','caption', tpl(v.caption)));
  }

  function animateNumber(node, from, to, suffix){
    if(reduce || from === to || isNaN(from)){ node.textContent = to + suffix; return; }
    const start = performance.now(), dur = 600;
    function step(t){ const k = Math.min(1,(t-start)/dur); const val = Math.round(from + (to-from)*(1-Math.pow(1-k,3))); node.textContent = val + suffix; if(k<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  function go(id, choice){
    const sc = SCENES[id];
    if(!sc){ $('bubble').textContent = 'Missing scene: ' + id; $('actions').innerHTML=''; return; }
    if(choice && choice.set) Object.assign(state.vars, choice.set);
    if(sc.set) Object.assign(state.vars, sc.set);
    state.current = id; if(!state.visited.includes(id)) state.visited.push(id);
    state.log.push({scene:id, choice: choice ? choice.label : null, tap: state.taps, t: Date.now() - state.t0});
    $('bar').style.width = Math.min(100, Math.round(100 * state.visited.length / total)) + '%';
    $('sceneid').hidden = !author; $('sceneid').textContent = id;
    setChar(sc.mood);
    renderVisual(sc.visual);
    const b = $('bubble'); b.textContent = tpl(cond(sc.line)); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    const acts = $('actions'); acts.innerHTML = '';
    if(author && sc.note){ const n = el('div','authornote', 'Author note: ' + sc.note); acts.appendChild(n); }
    const choices = (sc.choices || []).map(c => Object.assign({}, c, {label: tpl(cond(c.label)), next: cond(c.next)}));
    if(choices.length >= 2) state.decisions++;
    if(sc.input){
      const ta = document.createElement('textarea'); ta.className = 'reflect'; ta.placeholder = tpl(sc.input.placeholder || 'Write a line…'); ta.setAttribute('aria-label', ta.placeholder);
      acts.appendChild(ta);
      const btn = el('button','choice primary', sc.input.button || 'Continue'); btn.type = 'button';
      btn.addEventListener('click', () => { state.taps++; $('taps').textContent = state.taps; state.vars[sc.input.save || 'reflection'] = ta.value; go(cond(sc.input.next), {label: '[reflection] ' + ta.value}); });
      acts.appendChild(btn);
    }
    choices.forEach((c, i) => {
      const btn = el('button','choice' + ((c.primary || (choices.length === 1 && !sc.input)) ? ' primary' : ''), c.label); btn.type = 'button';
      btn.addEventListener('click', () => { state.taps++; $('taps').textContent = state.taps; go(c.next, c); });
      acts.appendChild(btn);
    });
    if(sc.end){
      const s = el('div','summary');
      s.textContent = 'End of this path. Taps: ' + state.taps + ' · Decisions: ' + state.decisions + ' · Scenes seen: ' + state.visited.length + ' of ' + total + '.';
      const code = el('code', null, JSON.stringify({deck: DECK.meta || {}, vars: state.vars, taps: state.taps, decisions: state.decisions, log: state.log}, null, 1));
      s.appendChild(code); acts.appendChild(s);
      const copy = el('button','choice','Copy session log'); copy.type='button';
      copy.addEventListener('click', () => { const txt = code.textContent; if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>{copy.textContent='Copied';}); else { code.focus(); copy.textContent='Select and copy the log above'; } });
      acts.appendChild(copy);
      const again = el('button','choice','Start over'); again.type='button'; again.addEventListener('click', restart); acts.appendChild(again);
    }
    const b2 = $('bubble'); b2.setAttribute('tabindex','-1'); b2.focus({preventScroll:true});
    window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'});
  }

  function restart(){ state.vars = {}; state.taps = 0; state.decisions = 0; state.log = []; state.visited = []; state.prevCounters = null; state.t0 = Date.now(); $('taps').textContent = '0'; go(DECK.start); }
  $('restart').addEventListener('click', restart);

  if(author){
    $('scenesBtn').hidden = false;
    $('scenesBtn').addEventListener('click', () => { const sh = $('sheet'); sh.innerHTML=''; Object.keys(SCENES).forEach(id => { const b = el('button', null, id + ' — ' + String(tpl(cond(SCENES[id].line))).slice(0,70)); b.addEventListener('click', () => { $('menu').classList.remove('open'); go(id); }); sh.appendChild(b); }); $('menu').classList.add('open'); });
    $('menu').addEventListener('click', e => { if(e.target === $('menu')) $('menu').classList.remove('open'); });
  }
  go(DECK.start);
})();
</script>
</body>
</html>
