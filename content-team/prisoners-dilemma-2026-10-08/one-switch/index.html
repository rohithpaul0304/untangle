<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>One switch. Two rooms. · Untangle</title>
<style>
:root{--bg:#fff;--ink:#1f2d36;--muted:#6b7a85;--line:#e1e8ee;--soft:#f4f7fa;--accent:#2f8fdd;--accent-dark:#1f6fb0;--you:#1d8a8a;--her:#b23a7a;--warm:#ffcf4d;--good:#2fb36a;--bad:#e5484d;--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;background:#eef2f5;color:var(--ink);font:17px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.phone{max-width:430px;min-height:100svh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
header .where{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;text-transform:none;font-size:13px}
button.ghost{font:inherit;font-size:12px;text-transform:none;letter-spacing:0;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;color:var(--muted);cursor:pointer}
main{flex:1;display:flex;flex-direction:column;padding:12px 14px 0;gap:12px}
footer{padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
h1{font-size:22px;line-height:1.2;margin:0}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.art{position:relative;border-radius:var(--radius);overflow:hidden;background:#f6f9fb;border:1px solid var(--line)}
.art img.scene{display:block;width:100%;height:auto}
.art.rooms img.scene,.art.jewel img.scene{max-height:230px;object-fit:cover}
.art.short img.scene{max-height:132px;object-fit:cover;object-position:center 30%}
.offer .cell{font-size:12px;padding:6px 8px}.offer .cell b{font-size:14px}
.portrait{position:absolute;right:10px;bottom:10px;width:72px;height:72px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);overflow:hidden;background:#fff}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .tag{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(255,255,255,.85);padding:1px 0;color:var(--ink)}
.portrait.left{right:auto;left:10px}
.guide{display:flex;align-items:flex-end;gap:10px}
.guide .fox{width:104px;height:104px;flex:none;display:flex;align-items:flex-end;justify-content:center}
.guide .fox img{max-width:100%;max-height:100%;object-fit:contain}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:11px 13px;font-size:17px;line-height:1.38}
.bubble:before{content:"";position:absolute;left:-12px;bottom:20px;border:7px solid transparent;border-right:9px solid var(--line)}
.bubble:after{content:"";position:absolute;left:-8px;bottom:21px;border:6px solid transparent;border-right:8px solid #fff}
.bubble:focus{outline:none}
.speech{border-left:4px solid var(--line);background:var(--soft);border-radius:0 14px 14px 0;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.speech .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.speech .face{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.speech .face img{width:100%;height:100%;object-fit:cover;display:block}
.speech p{margin:0;font-size:16px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.card .label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.offer{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.offer .cell{background:var(--soft);border-radius:10px;padding:7px 9px;font-size:13px;color:var(--muted);border:2px solid transparent}
.offer .cell b{display:block;color:var(--ink);font-size:15px;margin-top:2px}
.offer .cell.hi{border-color:var(--accent);background:#eef6fd}
.offer .cell.glow{border-color:var(--warm);background:#fff8dc}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.counter{background:var(--soft);border-radius:12px;padding:8px 10px}
.counter span{font-size:12px;color:var(--muted);display:block}
.counter b{font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.counter.you b{color:var(--you)}.counter.her b{color:var(--her)}
.concept{border:2px solid var(--warm);background:#fff9e3;border-radius:14px;padding:12px 14px}
.concept h2{margin:0 0 4px;font-size:20px}.concept p{margin:0;font-size:15px}
button.choice{font:inherit;font-size:17px;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;min-height:48px;text-align:center}
button.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button.choice.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dark)}
button.choice.primary:active{box-shadow:0 1px 0 var(--accent-dark)}
button.choice:disabled{opacity:.5;cursor:default}
button.choice:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* café */
.strip{display:grid;grid-template-columns:52px repeat(10,1fr);gap:3px;align-items:center;font-size:11px}
.strip .lab{color:var(--muted);text-align:right;padding-right:4px}
.strip .d{height:22px;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip .d.you.f{background:var(--you);color:#fff}.strip .d.her.f{background:var(--her);color:#fff}
.strip .d.low{opacity:.72}.strip .d.cur{box-shadow:0 0 0 2px var(--warm) inset}
.strip .head{text-align:center;color:var(--muted);font-size:10px}
.street{position:relative;height:184px;overflow:hidden}
.street img.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.street .tag{position:absolute;top:8px;background:rgba(255,255,255,.95);border-radius:10px;padding:4px 8px;font-size:12px;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.street .tag b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.street .tag.you{left:8px;border-left:4px solid var(--you)}.street .tag.her{right:8px;border-left:4px solid var(--her)}
.street .sale{position:absolute;top:54px;background:var(--warm);color:#5a3a00;font-weight:800;font-size:11px;letter-spacing:.08em;padding:3px 7px;border-radius:7px;transform:rotate(-6deg)}
.street .sale.you{left:12px}.street .sale.her{right:12px}
.street .grp{position:absolute;bottom:4px;width:13%;height:44%;left:0;transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .4s}
.street .grp img{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.street .count{position:absolute;bottom:6px;font-size:12px;background:rgba(255,255,255,.95);border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
.street .count.you{left:8px;color:var(--you)}.street .count.her{right:8px;color:var(--her)}
.street .portrait{bottom:auto;top:84px;width:56px;height:56px}
.proj{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proj .p{border-radius:12px;padding:8px 10px;background:var(--soft)}
.proj .p span{font-size:11px;color:var(--muted);display:block}
.proj .p b{font-size:20px;font-variant-numeric:tabular-nums}
.proj .p small{display:block;font-size:11px;color:var(--muted)}
.proj .p.you b{color:var(--you)}.proj .p.her b{color:var(--her)}
.totals{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px}
.totals b{font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.ctl .price{font-size:34px;font-weight:800;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.ctl button.step{font:inherit;font-size:26px;width:56px;height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);cursor:pointer;color:var(--ink)}
.ctl button.step:disabled{opacity:.35;box-shadow:none}
.ctl button.step:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.hint{font-size:12px;color:var(--muted);text-align:center}
.runs{display:grid;gap:10px}
.runs h3{margin:0 0 4px;font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:8px 6px}
.title h1{font-size:30px}
.title p{margin:0;color:var(--muted);font-size:16px}
.title .fox{height:150px;display:flex;justify-content:center}
.title .fox img{height:100%;object-fit:contain}
.credit{font-size:12px;color:var(--muted);text-align:center}
.sheet{position:fixed;inset:0;background:rgba(31,45,54,.5);display:flex;align-items:flex-end;z-index:9}
.sheet[hidden]{display:none}
.sheet .inner{background:#fff;width:100%;max-width:430px;margin:0 auto;max-height:70%;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.sheet .inner button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;padding:10px;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pulse{animation:pulse .6s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <header><span>Untangle</span><span class="where" id="where"></span><button class="ghost" id="menuBtn" hidden>Scenes</button><button class="ghost" id="restartBtn">Start over</button></header>
  <main id="main"></main>
  <footer id="actions"></footer>
</div>
<div class="sheet" id="sheet" hidden><div class="inner" id="sheetInner"></div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search);
const author=params.get('author')==='1';
const KEY='untangle-one-switch-v1';
const PRICES=[50,60,70,80,90,100];
const money=n=>'₹'+Number(n).toLocaleString('en-IN');

/* ---------- economics (Meera copies yesterday) ---------- */
const E={
  cups(a,b){return Math.max(0,Math.min(200,100+(b-a)*5));},
  pair(a,b){const c=E.cups(a,b);return [c*(a-50),(200-c)*(b-50)];},
  her(run){return run.yours.length?run.yours[run.yours.length-1]:100;},
  step(run,a){const b=E.her(run),p=E.pair(a,b);return {yours:[...run.yours,a],hers:[...run.hers,b],totals:[run.totals[0]+p[0],run.totals[1]+p[1]]};},
  fresh(){return {yours:[],hers:[],totals:[0,0]};},
  face(run){const n=run.yours.length;if(!n)return 'friendly';const a=run.yours[n-1],b=run.hers[n-1];if(a<100&&b<100&&a===b)return 'grim';if(b<a)return 'hard';if(a<b)return 'hurt';if(n>1&&run.hers[n-2]<b)return 'thawing';return 'friendly';},
  // the fox's reaction to the day that just ended
  react(run){const r=E.reactRaw(run);if(run.yours.length===10&&!/No tomorrow/.test(r[0]))r[0]=r[0].replace(/ (She copies you tomorrow\.|She’ll match you tomorrow\.|Same again tomorrow\?|Meera copies you tomorrow\.)/g,'')+' That was day ten.';return r;},
  reactRaw(run){
    const n=run.yours.length,a=run.yours[n-1],b=run.hers[n-1],gap=Math.abs(a-b),p=E.pair(a,b),c=E.cups(a,b);
    const prev=n>1?run.yours[n-2]:null;
    const quietRun=(()=>{let k=0;for(let i=n-2;i>=0&&run.yours[i]===100;i--)k++;return k;})();
    if(n===10&&prev!==null&&a<prev&&quietRun>=3)return ['Last day. No tomorrow. You grabbed the exit, same as the rooms.','surprised'];
    if(a===50)return ['At ₹50 every rupee pays for the coffee. Nothing left for you.'+(n<10?' Meera copies you tomorrow.':''),'thinking'];
    if(a<b){const firstTime=!run.yours.slice(0,-1).some((x,i)=>x<run.hers[i]);return [firstTime?`Cheaper by ₹${gap}. ${c} cups came to you. She noticed.`:`You undercut her again. ${c} cups today, less per cup. She copies you tomorrow.`,'surprised'];}
    if(a>b){if(c===0)return [`A ₹${gap} gap empties your café. Nothing today. Climb back ₹10 at a time.`,'surprised'];return [`Her price is lower today. ${c} cups for you, lean day. She copies you tomorrow.`,'thinking'];}
    if(a===100)return [n===1?'Five and five. She’ll match you tomorrow.':`Both at ₹100. ${money(p[0])} each. Same again tomorrow?`,'speaking'];
    return [`She copied you. Same price, half the street each, less per cup: ${money(p[0])} apiece.`,'thinking'];
  },
  recap(run){
    const y=run.yours,h=run.hers,lines=[];
    const changes=y.filter((v,i)=>i&&v!==y[i-1]).length;
    lines.push(`You started at ₹${y[0]} and finished at ₹${y[9]}. ${changes?`You changed your price ${changes} time${changes===1?'':'s'}, and every change set Meera’s price the next day.`:'You never changed it, so from day two Meera matched you every day.'}`);
    const low=Math.min(...y);
    if(low<100)lines.push(`Your lowest price was ₹${low}. Ten quiet days at ₹100 would have been ${money(50000)} each.`);
    else lines.push(`Ten quiet days. ${money(run.totals[0])} each, the most this street can pay two cafés.`);
    return lines;
  }
};

/* ---------- state ---------- */
let state=load()||initial();
function initial(){return {v:1,variant:params.get('prison')==='approved'?'approved':'tight',screen:'title',beat:0,prison:null,run:E.fresh(),first:null,selected:100,taps:0,log:[],started:Date.now()};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&s.run&&Array.isArray(s.run.yours)){if(params.get('prison'))s.variant=params.get('prison')==='approved'?'approved':'tight';if(s.screen!=='title'){s.resume=s.screen;s.resumeBeat=s.beat;s.screen='title';}return s;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function tap(label){state.taps++;state.log.push({t:Date.now()-state.started,screen:state.screen,beat:state.beat,label});}

/* ---------- small renderers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fox=(text,mood)=>`<div class="guide fade"><div class="fox"><img alt="" src="${ASSETS['fox_'+(mood||'speaking')]||ASSETS.fox_speaking}"></div><div class="bubble" id="bubble" tabindex="-1">${esc(text)}</div></div>`;
const speech=(who,text,face)=>`<div class="speech fade">${face?`<div class="face"><img alt="" src="${ASSETS[face]}"></div>`:''}<div><div class="who">${esc(who)}</div><p>${esc(text)}</p></div></div>`;
const portrait=(face,name,left)=>`<div class="portrait${left?' left':''}"><img alt="${esc(name)}" src="${ASSETS[face]}"><span class="tag">${esc(name)}</span></div>`;
const art=(which,inner,short)=>`<div class="art ${which}${short?' short':''}"><img class="scene" alt="" src="${ASSETS[which==='jewel'?'jewellery':which]}">${inner||''}</div>`;
const btn=(label,action,primary,extra)=>`<button class="choice${primary?' primary':''}" data-action="${action}" ${extra||''}>${esc(label)}</button>`;
function offerCard(opts){const o=Object.assign({hi:[],glow:[],label:'The deal · years in prison · you / Ravi'},opts||{});const cells=[['Both stay silent','1 / 1','ss'],['You name Ravi · he stays silent','0 / 5','ts'],['Ravi names you · you stay silent','5 / 0','st'],['Both name each other','3 / 3','tt']];return `<div class="card"><div class="label">${esc(o.label)}</div><div class="offer">${cells.map(c=>`<div class="cell${o.hi.includes(c[2])?' hi':''}${o.glow.includes(c[2])?' glow':''}">${c[0]}<b>${c[1]}</b></div>`).join('')}</div></div>`;}
function counters(you,ravi,animate){return `<div class="counters"><div class="counter you"><span>You · prison years</span><b data-count="${you}">${animate?0:you}</b></div><div class="counter her"><span>Ravi · prison years</span><b data-count="${ravi}">${animate?0:ravi}</b></div></div>`;}
function animateCounts(){document.querySelectorAll('[data-count]').forEach(el=>{const to=Number(el.dataset.count),from=Number(el.textContent.replace(/[^\d]/g,''))||0;if(reduce||from===to){el.textContent=to;return;}const t0=performance.now();const tick=t=>{const k=Math.min(1,(t-t0)/650);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);});}

/* ---------- screens ---------- */
const S={};
S.title=()=>({where:'',main:`<div class="title"><p class="kicker">A five-minute game</p><h1>One switch.<br>Two rooms.</h1><p>Why people betray each other, and what changes when there’s a tomorrow.</p><div class="fox"><img alt="" src="${ASSETS.fox_waiting}"></div>${author?`<p class="credit">Prison act: <b>${state.variant}</b> (author mode)</p>`:''}</div>`,
  actions:(state.prison||state.run.yours.length?btn('Continue','continue',true)+btn('Start again','restart'):btn('Play','start',true))+(author?btn('Switch prison act: '+(state.variant==='tight'?'approved':'tight'),'variant'):'')});

/* --- prison, tight --- */
S.p1=()=>({where:'The rooms',main:art('jewel')+fox('You and Ravi just robbed a jewellery store. Sirens.','surprised'),actions:btn('Run.','go:p2',true)});
S.p2=()=>({where:'The rooms',main:art('rooms',portrait('ravi_scared','Ravi'))+fox('Caught. Two rooms. You can’t talk to him and he can’t talk to you.','thinking'),actions:btn('The door opens.','go:p3',true)});
S.p3=()=>({where:'The rooms',main:art('rooms',portrait('ravi_scared','Ravi'),true)+speech('Inspector','Name Ravi and you walk out today. Stay quiet and if he names you, five years. Both quiet: one year each. Both talk: three each. He’s getting the same offer right now.','inspector')+offerCard()+fox('You want the fewest years. So does he. What do you say?','thinking'),actions:`<div class="row2">${btn('Stay silent','prison:silent')}${btn('Name Ravi','prison:talk')}</div>`});
S.p4=()=>{const t=state.prison==='talk';return {where:'The rooms',main:art('rooms',portrait(t?'ravi_cold':'ravi_ashamed','Ravi'))+speech('Inspector','Ravi talked.','inspector')+counters(t?3:5,t?3:0,true)+fox(t?'Three years each. You both grabbed the same exit.':'Five years. He walks. You kept a deal he broke.',t?'thinking':'surprised'),actions:btn('Why did he do it?','go:p5',true),after:animateCounts};};
S.p5=()=>{const t=state.prison==='talk';return {where:'The rooms',main:art('rooms',portrait('ravi_scared','Ravi',true)+portrait('inspector','Inspector'),true)+offerCard({hi:t?['tt','ts']:['st','ss'],label:'Ravi’s side of the deal · you / Ravi'})+fox(t?'Same offer, from his chair. You talked, so naming you got him three years instead of five. Had you stayed quiet, naming you got him zero instead of one. Either way, talking was his safe move.':'Same offer, from his chair. You stayed quiet, so naming you got him zero instead of one. Had you talked, naming you got him three instead of five. Either way, talking was his safe move.','thinking'),actions:btn('And for me?','go:p6',true)};};
S.p6=()=>({where:'The rooms',main:offerCard({hi:['tt','st'],glow:['ss'],label:'Your side of the deal · you / Ravi'})+fox('Same for you. Whatever Ravi did, talking cut your years. Two people, each doing the safe thing. One year each was on the table, and neither of you could reach it alone.','thinking')+`<div class="concept fade"><h2>Prisoner’s dilemma</h2><p>When the move that’s safest for each person leaves both worse off than the move they’d pick together.</p></div>`,actions:btn('Is it always like this?','go:c1',true)});

/* --- prison, approved (13 taps, text as approved on 8 October 2026) --- */
const OFFERS=[['The inspector pulls up a chair. He wants you to name Ravi.','I’m offering you a deal. Listen before you decide.'],['','If you both stay silent, you each get one year.'],['','If you name Ravi and he stays silent, you go free. Ravi gets five years.'],['','If Ravi names you and you stay silent, he goes free. You get five years.'],['','If you both name each other, you each get three years.'],['You both want the fewest prison years. What do you say?','Ravi is getting this same offer. Neither of you knows what the other will say.']];
S.a1=()=>({where:'01 / The rooms',main:`<h1>One switch. Two rooms.</h1>`+art('jewel')+fox('You and Ravi just robbed a jewellery store. Sirens.','surprised'),actions:btn('Run.','go:a2',true)});
S.a2=()=>({where:'01 / The rooms',main:`<h1>Caught.</h1>`+art('rooms',portrait('ravi_scared','Ravi'))+fox('Caught. Two rooms. You can’t talk to him and he can’t talk to you.','thinking'),actions:btn('The door opens.','go:a3',true)});
S.a3=()=>{const b=state.beat,o=OFFERS[b];let m=`<h1>${b===0?'The door opens.':b===5?'Your choice.':'The inspector’s offer.'}</h1>`+art('rooms',portrait('ravi_scared','Ravi'));if(b===0)m+=fox(o[0],'thinking');m+=speech('Inspector',o[1],'inspector');if(b!==0&&o[0])m+=fox(o[0],'thinking');if(b===5)m+=`<details class="card"><summary>Read the offer again</summary><div class="offer" style="margin-top:8px"><div class="cell">Both stay silent<b>1 year each</b></div><div class="cell">You name Ravi; he stays silent<b>You go free. Ravi 5 years</b></div><div class="cell">Ravi names you; you stay silent<b>Ravi goes free. You 5 years</b></div><div class="cell">Both name each other<b>3 years each</b></div></div></details>`;return {where:'01 / The rooms',main:m,actions:b===5?`<div class="row2">${btn('Stay silent','prison:silent')}${btn('Name Ravi','prison:talk')}</div>`:btn(b===0?'Hear the deal.':'Continue','beat',true)};};
S.a4=()=>{const t=state.prison==='talk';return {where:'01 / The rooms',main:`<h1>Ravi talked.</h1>`+art('rooms',portrait(t?'ravi_cold':'ravi_ashamed','Ravi'))+speech('Inspector','Ravi talked.','inspector')+counters(t?3:5,t?3:0,true)+fox(t?'You named Ravi. He named you. Three years each.':'You stayed silent. Ravi named you. Five years for you; none for him.','thinking'),actions:btn('Why name me?','go:a5',true),after:animateCounts};};
S.a5=()=>{const t=state.prison==='talk',b=state.beat;const actual=t?['You named Ravi. His options under the deal: three years for naming you, or five for staying silent.','3 years','5 years']:['You stayed silent. His options under the deal: freedom for naming you, or one year for staying silent.','Go free','1 year'];const other=t?['He couldn’t know your statement. If you stayed silent, naming you meant freedom instead of one year.','Go free','1 year']:['He couldn’t know your statement. If you named him, naming you meant three years instead of five.','3 years','5 years'];let m=`<h1>His chair.</h1>`+art('rooms',portrait(t?'ravi_cold':'ravi_ashamed','Ravi'))+`<div class="hint">What happened · You ${t?'3':'5'} years · Ravi ${t?'3 years':'free'}</div>`;if(b<2){const it=b===0?actual:other;m+=fox(it[0],'thinking')+`<div class="card"><div class="label">Ravi’s options under the deal · ${b===0?(t?'you named him':'you stayed silent'):(t?'if you stayed silent':'if you named him')}</div><div class="offer"><div class="cell">Name you<b>${it[1]}</b></div><div class="cell">Stay silent<b>${it[2]}</b></div></div></div>`;return {where:'01 / The rooms',main:m,actions:btn(b===0?'And the other possibility?':'What did the offer reward?','beat',true)};}m+=fox('The offer rewarded him for naming you, whichever statement you made.','thinking');return {where:'01 / The rooms',main:m,actions:btn('And for me?','go:a6',true)};};
S.a6=()=>{const b=state.beat;let m=`<h1>The pressure on both of you.</h1>`+art('rooms',portrait(state.prison==='talk'?'ravi_cold':'ravi_ashamed','Ravi'));if(b===0){m+=fox('The same pressure was on you. Ravi named you: naming him meant three years; staying silent meant five.','thinking')+`<div class="card"><div class="label">Your options under the deal · Ravi named you</div><div class="offer"><div class="cell">Name Ravi<b>3 years</b></div><div class="cell">Stay silent<b>5 years</b></div></div></div>`;return {where:'01 / The rooms',main:m,actions:btn('So why is this a dilemma?','beat',true)};}m+=fox('Talking cut your years either way. But if both of you talked, you each got three years. Both silent meant just one each.','thinking')+`<div class="card"><div class="label">Two shared outcomes in the offer</div><div class="offer"><div class="cell">Both stay silent<b>1 year each</b></div><div class="cell">Both name each other<b>3 years each</b></div></div></div><div class="concept fade"><h2>Prisoner’s dilemma</h2><p>Each person has a move that cuts their own years, whatever the other does. When both make that move, both end up worse off than if both stayed silent.</p></div>`;return {where:'01 / The rooms',main:m,actions:btn('Is it always like this?','go:c1',true)};};

/* --- café --- */
S.c1=()=>({where:'Tomorrow exists',main:art('cafes',portrait('meera_friendly','Meera'))+fox('Different life. You run a café. Meera runs the one next door. Every morning you both set a price, and every morning you’ll see her again.','speaking'),actions:btn('Open the café.','go:day',true)});

function street(run,myPrice,herPrice,previewCups){
  const cups=previewCups,groups=Math.round(cups/50);
  let g='';for(let i=0;i<4;i++){const mine=i<groups,slot=mine?i:i-groups;const x=mine?(6+slot*11):(56+slot*11);g+=`<div class="grp" data-i="${i}" style="transform:translateX(${x/13*100}%)"><img alt="" src="${ASSETS.customers}"></div>`;}
  return `<div class="art street"><img class="scene" alt="" src="${ASSETS.cafes}"><div class="tag you">You<b>₹${myPrice}</b></div><div class="tag her">Meera<b>₹${herPrice}</b></div>${myPrice<herPrice?'<div class="sale you">SALE</div>':''}${herPrice<myPrice?'<div class="sale her">SALE</div>':''}${g}<div class="count you">${cups} customers</div><div class="count her">${200-cups} customers</div>${portrait('meera_'+E.face(run),'Meera')}</div>`;
}
function stripHTML(run,cur){const cell=(arr,i,cls)=>{const v=arr[i];const f=v!==undefined;return `<div class="d ${cls}${f?' f':''}${f&&v<100?' low':''}${i===cur?' cur':''}">${f?v:''}</div>`;};return `<div class="strip"><div class="lab"></div>${Array.from({length:10},(_,i)=>`<div class="head">${i+1}</div>`).join('')}<div class="lab">You</div>${Array.from({length:10},(_,i)=>cell(run.yours,i,'you')).join('')}<div class="lab">Meera</div>${Array.from({length:10},(_,i)=>cell(run.hers,i,'her')).join('')}</div>`;}
S.day=()=>{
  const run=state.run,n=run.yours.length,day=n+1,her=E.her(run),a=state.selected,p=E.pair(a,her),cups=E.cups(a,her);
  let foxLine,mood;
  if(n===0){foxLine='Meera starts at ₹100. Move your price and watch the street. When you’re ready, open for the day.';mood='speaking';}
  else{[foxLine,mood]=E.react(run);}
  const main=`<div class="hint" style="text-align:left">Day ${day} of 10${state.first?' · run 2':''}</div>${stripHTML(run,n)}${street(run,a,her,cups)}${fox(foxLine,mood)}<div class="proj"><div class="p you"><span>You today at ₹${a}</span><b id="projYou">${money(p[0])}</b><small>${cups} cups × ₹${a-50}</small></div><div class="p her"><span>Meera at ₹${her}</span><b id="projHer">${money(p[1])}</b><small>${200-cups} cups × ₹${her-50}</small></div></div><div class="totals"><span>So far · you <b>${money(run.totals[0])}</b></span><span>Meera <b>${money(run.totals[1])}</b></span></div><div class="ctl"><button class="step" data-action="price:-10" aria-label="Lower price by ten rupees" ${a<=50?'disabled':''}>−</button><div class="price">₹${a}</div><button class="step" data-action="price:10" aria-label="Raise price by ten rupees" ${a>=100?'disabled':''}>+</button></div>`;
  return {where:`Tomorrow exists · day ${day}`,main,actions:btn(`Open day ${day} at ₹${a}`,'confirm',true)};
};
S.summary=()=>{const run=state.run,first=state.first;let m=`<h1>Ten days.</h1>`;if(first){m+=`<div class="runs"><div><h3>Run 1</h3>${stripHTML(first,-1)}<div class="totals"><span>You <b>${money(first.totals[0])}</b></span><span>Meera <b>${money(first.totals[1])}</b></span></div></div><div><h3>Run 2</h3>${stripHTML(run,-1)}<div class="totals"><span>You <b>${money(run.totals[0])}</b></span><span>Meera <b>${money(run.totals[1])}</b></span></div></div></div>`;}else{m+=stripHTML(run,-1)+`<div class="counters"><div class="counter you"><span>You · ten days</span><b>${money(run.totals[0])}</b></div><div class="counter her"><span>Meera · ten days</span><b>${money(run.totals[1])}</b></div></div>`;}
  const rc=E.recap(run),react=E.react(run);const lines=[react[0],rc[0]];if(first){const d=run.totals[0]-first.totals[0];lines.push(d===0?'Same total both runs.':`Run 2 ${d>0?'earned':'lost'} ${money(Math.abs(d))} ${d>0?'more':'less'} than run 1.`);}
  m+=fox(lines.join(' '),react[1])+`<div class="hint">${esc(rc[1])} Meera is a programmed character: ₹100 on day one, then your previous day’s price.</div>`;
  return {where:'What happened',main:m,actions:(first?'':btn('Run the ten days again','replay'))+btn('What did I learn?','go:take',true)};};
const TAKE=[['In the rooms there was no tomorrow, so talking was the safe move for both of you.','thinking'],['With Meera there is always a tomorrow. Your price today sets her price tomorrow, so the safe move changes shape when you’ll meet again. Until day ten, when there is no next move.','speaking'],['Before you grab the safe move, ask one thing: will I see this person again?','celebrating']];
S.take=()=>({where:'What did I learn?',main:art('cafes',portrait('meera_'+(state.beat===2?'friendly':'thawing'),'Meera'))+fox(TAKE[state.beat][0],TAKE[state.beat][1])+(state.beat===2?`<div class="concept fade"><h2>The dilemma changes shape</h2><p>Same people, same prices. Add a tomorrow, and the move that was safe becomes expensive, because the other person remembers.</p></div>`:''),actions:btn(state.beat<2?'And so…':'Finish','beat',true)});
S.end=()=>({where:'',main:`<div class="title"><p class="kicker">Lesson complete</p><h1>You played the whole thing.</h1><p>One decision in the rooms, ten days on the street${state.first?', twice':''}. Your totals: ${money(state.run.totals[0])} to Meera’s ${money(state.run.totals[1])}.</p><div class="fox"><img alt="" src="${ASSETS.fox_celebrating}"></div><p class="credit">Untangle · learn anything by playing it</p></div>`,actions:btn('Play again','restart',true)+(author?btn('Copy session log','copylog'):'')});

/* ---------- render ---------- */
let gen=0;
function render(opts){
  gen++;const g=gen;
  const key=state.screen;const scr=S[key]();
  $('#where').textContent=scr.where||'';
  $('#main').innerHTML=scr.main;
  $('#actions').innerHTML=scr.actions||'';
  $('#menuBtn').hidden=!author;
  document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action,b)));
  if(scr.after)scr.after();
  const bub=$('#bubble');if(bub)bub.focus({preventScroll:true});
  if(!opts||!opts.keepScroll)window.scrollTo({top:0,behavior:'auto'});
  save();
}
function go(screen,beat){state.screen=screen;state.beat=beat||0;render();}
function act(action,el){
  if(action==='start'){tap('Play');state=Object.assign(initial(),{variant:state.variant});go(state.variant==='tight'?'p1':'a1');return;}
  if(action==='continue'){tap('Continue');go(state.resume||'p1',state.resumeBeat||0);return;}
  if(action==='restart'){tap('Start again');const v=state.variant;state=initial();state.variant=v;go('title');return;}
  if(action==='variant'){state.variant=state.variant==='tight'?'approved':'tight';render();return;}
  if(action==='beat'){tap(el.textContent);state.beat++;if(state.screen==='a3'&&state.beat>5)state.beat=5;if(state.screen==='a5'&&state.beat>2)state.beat=2;if(state.screen==='a6'&&state.beat>1)state.beat=1;if(state.screen==='take'&&state.beat>2){go('end');return;}render();return;}
  if(action.startsWith('go:')){tap(el.textContent);go(action.slice(3));return;}
  if(action.startsWith('prison:')){state.prison=action.slice(7);tap(el.textContent);go(state.variant==='tight'?'p4':'a4');return;}
  if(action.startsWith('price:')){const d=Number(action.slice(6));const i=PRICES.indexOf(state.selected)+(d>0?1:-1);if(i<0||i>=PRICES.length)return;state.selected=PRICES[i];tap('price '+state.selected);render({keepScroll:true});return;}
  if(action==='confirm'){tap(el.textContent);confirmDay();return;}
  if(action==='replay'){tap('Run again');state.first=state.run;state.run=E.fresh();state.selected=100;go('day');return;}
  if(action==='copylog'){const txt=JSON.stringify({variant:state.variant,prison:state.prison,run:state.run,first:state.first,taps:state.taps,log:state.log},null,1);if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>{el.textContent='Copied';});return;}
}
function confirmDay(){
  const a=state.selected;const before=state.run;state.run=E.step(before,a);
  document.querySelectorAll('[data-action]').forEach(b=>b.disabled=true);
  const p=E.pair(a,E.her(before));
  const py=$('#projYou'),ph=$('#projHer');if(py){py.classList.add('pulse');ph.classList.add('pulse');}
  const done=()=>{if(state.run.yours.length>=10){state.selected=a;go('summary');}else{render();}};
  if(reduce)done();else setTimeout(done,700);
}
let armed=false;$('#restartBtn').addEventListener('click',()=>{if(!armed){armed=true;$('#restartBtn').textContent='Really start over?';setTimeout(()=>{armed=false;$('#restartBtn').textContent='Start over';},3000);return;}armed=false;$('#restartBtn').textContent='Start over';const v=state.variant;state=initial();state.variant=v;go('title');});
$('#menuBtn').addEventListener('click',()=>{const inner=$('#sheetInner');inner.innerHTML=Object.keys(S).map(k=>`<button data-jump="${k}">${k}</button>`).join('');inner.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{$('#sheet').hidden=true;if(!state.prison)state.prison='silent';go(b.dataset.jump);}));$('#sheet').hidden=false;});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true;});
window.untangle={get state(){return structuredClone(state);},E};
render();
})();
</script>
