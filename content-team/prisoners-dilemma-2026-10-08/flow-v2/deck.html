'use strict';const E=LessonEngine,fox=JSON.parse(document.querySelector('#character').textContent).images,$=s=>document.querySelector(s),money=n=>'₹'+n.toLocaleString('en-IN'),KEY='untangle-pd-flow-v2';
const initial=()=>({version:4,selectedPrice:100,cafeBeat:0,phase:'choose',scene:1,beat:0,dealBeat:0,reasoningBeat:0,prison:null,run:E.fresh(),first:null,log:[]});let state;try{state=E.restore(localStorage.getItem(KEY))||initial()}catch{state=initial()}let generation=0,locked=false,lastActionAt=0,totalFrame=null;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#save-label').textContent='Progress saved on this device.'}catch{$('#save-label').textContent='Saving is unavailable in this browser. Keep this tab open.'}}
function event(type,data={}){state.log=Array.isArray(state.log)?state.log:[];state.log.push({type,...data,at:new Date().toISOString()});save()}
function btn(label,action,secondary=false){return `<button data-action="${action}" class="${secondary?'secondary':''}">${label}</button>`}
function dialogue(text,mood='speaking'){return `<div class="dialogue"><img class="fox" src="${fox[mood]||fox.speaking}" alt=""><div class="bubble">${text}</div></div>`}
const positions={scared:'0% 0%',ashamed:'50% 0%',cold:'100% 0%',friendly:'0% 50%',hurt:'50% 50%',hard:'100% 50%',thawing:'0% 100%',grim:'50% 100%',inspector:'100% 100%'};
function art(scene,face,name,run){let sales='';if(run?.yours.length){if(run.yours.at(-1)<100)sales+='<span class="sale you">SALE · YOU</span>';if(run.hers.at(-1)<100)sales+='<span class="sale her">SALE · MEERA</span>'}return `<div class="stage"><img class="scene" src="${scene==='cafes'?'assets/cafes-distinct.png':'../candidates/b/assets/'+scene+'.png'}" alt="${scene==='jewellery'?'A jewellery store at night':scene==='rooms'?'Two separate interview rooms':'Your café and Meera’s café next door'}">${sales}${face?`<div class="portrait" role="img" aria-label="${name}: ${face}" style="background-position:${positions[face]}"></div><span class="portrait-label">${name}</span>`:''}</div>`}
function board(cafe=false,active=''){let cells=cafe?[['Both usual','₹5,000 / ₹5,000'],['You discount · she usual','₹6,000 / ₹2,500'],['You usual · she discounts','₹2,500 / ₹6,000'],['Both discount','₹4,000 / ₹4,000']]:[['Both silent','1 / 1'],['You name · he silent','0 / 5'],['You silent · he names','5 / 0'],['Both name','3 / 3']];return `<div class="sheet"><div class="sheet-label">${cafe?'Money you keep · you / Meera':'The deal · years in prison · you / Ravi'}</div><div class="grid">${cells.map((c,i)=>`<div class="cell ${String(i)===String(active)?'active':''}">${c[0]}<b>${c[1]}</b></div>`).join('')}</div></div>`}
function counters(r,daily=true){const n=r.yours.length,p=n?E.pair(r.yours.at(-1),r.hers.at(-1)):[0,0];return `<div class="counters">${['You','Meera'].map((name,i)=>`<div class="counter"><span>${name} · ${daily?'running total':'ten-day total'}</span><b class="${daily?'total-value':''}" data-total="${r.totals[i]}" data-before="${r.totals[i]-p[i]}">${money(r.totals[i])}</b><small>Money you keep</small></div>`).join('')}</div>`}

function history(r){return `<div class="history" aria-label="Price history"><div class="strip"><span>Day</span>${Array.from({length:10},(_,i)=>`<span style="text-align:center">${i+1}</span>`).join('')}</div>${[['You',r.yours],['Meera',r.hers]].map(([name,arr])=>`<div class="strip"><span>${name}</span>${Array.from({length:10},(_,i)=>`<span class="dot ${arr[i]===100?'u':arr[i]!==undefined?'d':''}" aria-label="${name}, day ${i+1}: ${arr[i]!==undefined?'₹'+arr[i]:'not played'}">${arr[i]??'·'}</span>`).join('')}</div>`).join('')}<div class="legend">Price per coffee · ₹</div></div>`}

function compactPicker(){return '<div class="price-picker" role="group" aria-label="Choose tomorrow’s coffee price"><button data-action="price-down" aria-label="Decrease price by 10 rupees" '+(state.selectedPrice===50?'disabled':'')+'>−</button><output aria-live="polite">₹'+state.selectedPrice+'</output><button data-action="price-up" aria-label="Increase price by 10 rupees" '+(state.selectedPrice===100?'disabled':'')+'>+</button></div><div class="price-hint">₹'+state.selectedPrice+' paid − ₹50 making coffee = ₹'+(state.selectedPrice-50)+' you keep per cup</div>'}
function dailyCause(d,n){let line;if(d.prices[0]===50)line='At ₹50, every payment goes into making the coffee. You keep ₹0.';else if(d.cups[0]===0)line='Meera is ₹20 or more cheaper. All 200 customers go to her.';else if(d.prices[0]===d.prices[1])line='Same price, so the 200 customers split evenly.';else if(d.cups[1]===0)line='You are ₹20 or more cheaper. All 200 customers come to you.';else line=d.prices[0]<d.prices[1]?'Your price is ₹10 lower: 50 customers move to you.':'Meera’s price is ₹10 lower: 50 customers move to her.';return line+(n===10?' Day ten: there’s no next move.':'')}
function customerScene(d){let groups='';let id=0;for(let side=0;side<2;side++)for(let k=0;k<d.cups[side]/50;k++){const x=(side===0?15:67)+(k%2)*18,y=63+Math.floor(k/2)*15;groups+='<img class="customer-group" src="assets/customer-group.png" alt="" style="--gx:'+x+'%;--gy:'+y+'%;--delay:'+(180+id*75)+'ms">';id++;}return '<div class="customer-scene" role="img" aria-label="Today: your price ₹'+d.prices[0]+', '+d.cups[0]+' customers; Meera’s price ₹'+d.prices[1]+', '+d.cups[1]+' customers. Each pictured group represents 50 customers."><img class="cafe-background" src="assets/cafes-distinct.png" alt=""><span class="price-sign left">Your café · ₹'+d.prices[0]+'</span><span class="price-sign right">Meera’s café · ₹'+d.prices[1]+'</span>'+groups+'<div class="customer-count left">'+d.cups[0]+' customers</div><div class="customer-count right">'+d.cups[1]+' customers</div></div><div class="group-key">Each group represents 50 customers.</div>'}
function render(animate=false){if(totalFrame!==null){cancelAnimationFrame(totalFrame);totalFrame=null;}generation++;locked=false;const s=state.scene,r=state.run,n=r.yours.length;let html='',buttons='';
if(s<=7){const title={1:'One switch. Two rooms.',2:'Caught.',3:state.dealBeat===5?'Your choice.':state.dealBeat?'The inspector’s offer.':'The door opens.',4:'Ravi talked.',5:'His chair.',6:'The pressure on both of you.',7:'A next round.'}[s];html=`<div class="eyebrow">${s===7?'02 / Tomorrow exists':'01 / The rooms'}</div><h1>${title}</h1>`;html+=art(s===1?'jewellery':s===7?'cafes':'rooms',s===1?null:s===7?'friendly':s===2||s===3?'scared':state.prison==='silent'?'ashamed':'cold',s===7?'Meera':'Ravi');
if(s===1){html+=dialogue('You and Ravi just robbed a jewellery store. Sirens.','surprised');buttons=btn('Run.','next')}
if(s===2){html+=dialogue('Caught. Two rooms. You can’t talk to him and he can’t talk to you.','thinking');buttons=btn('The door opens.','next')}
if(s===3){const offers=[['The inspector pulls up a chair. He wants you to name Ravi.','I’m offering you a deal. Listen before you decide.'],['','If you both stay silent, you each get one year.'],['','If you name Ravi and he stays silent, you go free. Ravi gets five years.'],['','If Ravi names you and you stay silent, he goes free. You get five years.'],['','If you both name each other, you each get three years.'],['You both want the fewest prison years. What do you say?','Ravi is getting this same offer. Neither of you knows what the other will say.']];const beat=state.dealBeat||0;if(beat===0)html+=dialogue(offers[beat][0],'thinking');html+='<div class="inspector deal-offer"><strong>Inspector</strong><p>'+offers[beat][1]+'</p></div>';if(beat!==0&&offers[beat][0])html+=dialogue(offers[beat][0],'thinking');if(beat===5){html+='<details class="offer-review"><summary>Read the offer again</summary><div class="offer-row"><b>Both stay silent</b><span>You each get 1 year.</span></div><div class="offer-row"><b>You name Ravi; he stays silent</b><span>You go free. Ravi gets 5 years.</span></div><div class="offer-row"><b>Ravi names you; you stay silent</b><span>Ravi goes free. You get 5 years.</span></div><div class="offer-row"><b>Both name each other</b><span>You each get 3 years.</span></div></details>';buttons=btn('Stay silent','silent')+btn('Name Ravi','talk')}else buttons=btn(beat===0?'Hear the deal.':'Continue','deal-next')}

if(s===4){html+='<div class="inspector"><strong>Inspector</strong>Ravi talked.</div><div class="counters"><div class="counter"><span>You · prison years</span><b>'+ (state.prison==='silent'?5:3)+'</b></div><div class="counter"><span>Ravi · prison years</span><b>'+(state.prison==='silent'?0:3)+'</b></div></div>'+dialogue(state.prison==='silent'?'You stayed silent. Ravi named you. Five years for you; none for him.':'You named Ravi. He named you. Three years each.','thinking');buttons=btn('Why name me?','next')}
if(s===5){const talked=state.prison==='talk',beat=state.reasoningBeat||0,actual=talked?['You named Ravi. His options under the deal: three years for naming you, or five for staying silent.',3,5]:['You stayed silent. His options under the deal: freedom for naming you, or one year for staying silent.',0,1],other=talked?['He couldn’t know your statement. If you stayed silent, naming you meant freedom instead of one year.',0,1]:['He couldn’t know your statement. If you named him, naming you meant three years instead of five.',3,5];html+='<div class="result-anchor">What happened · You '+(talked?'3':'5')+' years · Ravi '+(talked?'3 years':'free')+'</div>';if(beat<2){const item=beat===0?actual:other;html+=dialogue(item[0],'thinking')+'<div class="sheet"><div class="sheet-label">Ravi’s options under the deal · '+(beat===0?(talked?'you named him':'you stayed silent'):(talked?'if you stayed silent':'if you named him'))+'</div><div class="grid"><div class="cell">Name you<b>'+ (item[1]===0?'Go free':item[1]+' years')+'</b></div><div class="cell">Stay silent<b>'+item[2]+' '+(item[2]===1?'year':'years')+'</b></div></div></div>';buttons=btn(beat===0?'And the other possibility?':'What did the offer reward?','reason-next')}else{html+=dialogue('The offer rewarded him for naming you, whichever statement you made.','thinking');buttons=btn('And for me?','next')}}
if(s===6){const beat=state.reasoningBeat||0;if(beat===0){html+=dialogue('The same pressure was on you. Ravi named you: naming him meant three years; staying silent meant five.','thinking')+'<div class="sheet"><div class="sheet-label">Your options under the deal · Ravi named you</div><div class="grid"><div class="cell">Name Ravi<b>3 years</b></div><div class="cell">Stay silent<b>5 years</b></div></div></div>';buttons=btn('So why is this a dilemma?','reason-next')}else{html+=dialogue('Talking cut your years either way. But if both of you talked, you each got three years. Both silent meant just one each.','thinking')+'<div class="sheet"><div class="sheet-label">Two shared outcomes in the offer</div><div class="grid"><div class="cell">Both stay silent<b>1 year each</b></div><div class="cell">Both name each other<b>3 years each</b></div></div></div><div class="concept"><h2>Prisoner’s dilemma</h2><p>Each person has a move that cuts their own years, whatever the other does. When both make that move, both end up worse off than if both stayed silent.</p></div>';buttons=btn('Is it always like this?','next')}}

if(s===7){const intro=[['You run this café. You sell coffee.','Make one sale.'],['A customer buys one coffee and pays you ₹100.','What do you keep?'],['Making that coffee costs ₹50. You keep the other ₹50.','Try your own price.'],['Try changing your price. Making one coffee always costs ₹50.','Meet your neighbour.'],['Meera runs the café next door. She sells the same coffee.','Who buys?'],['In this simulation, 200 people buy one coffee each day. Equal prices split them: 100 customers each.','And different prices?'],['Every ₹10 price gap moves 50 customers toward the cheaper café. A ₹20 gap sends all 200 there. Bigger gaps cannot add more customers.','So cheaper always wins?'],['Cheaper means more cups, but less money from each cup. You’ll see both effects before you choose again.','What does Meera do?'],['Play ten days. Meera starts at ₹100, then copies your previous day’s price. Try to keep the most money across the ten days.','Open day one.']];const beat=state.cafeBeat||0;const titles=['Your café.','One sale.','What you keep.','Set your coffee price.','Meet Meera.','Who buys?','When prices differ.','More cups. Less per cup.','Ten days together.'];html='<div class="eyebrow">02 / Tomorrow exists</div><h1>'+titles[beat]+'</h1>'+(beat<4?'<div class="solo-cafe"><img src="assets/cafes-distinct.png" alt="Your café"><span>Your café</span></div>':art('cafes','friendly','Meera')+'<div class="cafe-names"><span>Your café</span><span>Meera’s café</span></div>');if(state.migrationNotice)html+='<div class="summary">The café rules have changed. Your rooms progress is kept; this café run starts fresh.</div>';if(beat===1)html+='<div class="sale-receipt"><div><span>One customer · one coffee</span><b>Pays you ₹100</b></div></div>';if(beat===2)html+='<div class="coffee-receipt"><b>Customer paid ₹100</b><span>↓</span><div class="grid"><div><span>Making the coffee</span><strong>₹50</strong></div><div><span>You keep</span><strong>₹50</strong></div></div></div>';if(beat===3){html=html.replace('<h1>A next round.</h1>','<h1>Set your coffee price.</h1>');html+='<div class="section-label">Practice · no sales yet</div><div class="price-hint">Selling price per cup</div><div class="price-picker" role="group" aria-label="Practice changing your coffee price"><button data-action="price-down" aria-label="Decrease price by 10 rupees" '+(state.selectedPrice===50?'disabled':'')+'>−</button><output aria-live="polite">₹'+state.selectedPrice+'</output><button data-action="price-up" aria-label="Increase price by 10 rupees" '+(state.selectedPrice===100?'disabled':'')+'>+</button></div><div class="price-hint">Making one coffee ₹50<br><b>You keep ₹'+(state.selectedPrice-50)+' per cup</b></div>';intro[beat]=[state.selectedPrice===50?'At ₹50, the sale only covers making the coffee.':'Try changing your price. Making one coffee always costs ₹50.','Meet your neighbour.'];}if(beat===5||beat===6)html+='<div class="coffee-receipt"><b>200 customers · 200 cups</b><span>'+ (beat===5?'Same price: 100 each':'₹10 gap: cheaper café 150, other café 50. ₹20+ gap: cheaper café 200, other café 0.')+'</span></div>';html+=dialogue(intro[beat][0]);buttons=btn(intro[beat][1],beat===8?'open-cafe':'cafe-intro')}
}else if(s===8){const phase=state.phase||'choose',choosing=phase==='choose',day=choosing?n+1:n,herPrice=n?r.yours.at(-1):100;html=`<div class="eyebrow">02 / Tomorrow exists · run ${state.first?2:1}</div><h1>Day ${day}${day===10?' · final day':''} · ${choosing?'morning':'closing time'}</h1>`+art('cafes',E.expression(r),'Meera',choosing?null:r);if(choosing){html+=(n?'<div class="copy-link"><span>You yesterday<br><b>₹'+herPrice+'</b></span><span aria-hidden="true">→</span><span>Meera today<br><b>₹'+herPrice+'</b></span></div>':'<div class="coffee-receipt"><span>Meera’s price today</span><strong>₹100</strong></div>')+dialogue(n?'Meera copied your day '+n+' price. What will you charge today?':'Meera starts at ₹100. What will you charge?');html+='<div class="price-picker" role="group" aria-label="Choose your coffee price"><button data-action="price-down" aria-label="Decrease price by 10 rupees" '+(state.selectedPrice===50?'disabled':'')+'>−</button><output aria-live="polite">₹'+state.selectedPrice+'</output><button data-action="price-up" aria-label="Increase price by 10 rupees" '+(state.selectedPrice===100?'disabled':'')+'>+</button></div><div class="price-hint">Customer pays ₹'+state.selectedPrice+'<br>− Making coffee ₹50<br><b>= You keep ₹'+(state.selectedPrice-50)+' per cup.</b></div>';buttons=btn('Confirm ₹'+state.selectedPrice,'confirm-price')}else{const d=E.detail(r.yours.at(-1),r.hers.at(-1));const receipt=(mode)=>'<div class="counters">'+['You','Meera'].map((name,i)=>'<div class="counter"><span>'+name+' · ₹'+d.prices[i]+' per cup</span><b>'+(mode==='cups'?d.cups[i]+' cups':mode==='margin'?'₹'+d.margins[i]+' / cup':money(d.retained[i]))+'</b><small>'+(mode==='cups'?'customers served':mode==='margin'?'₹'+d.prices[i]+' − ₹50 cup cost':d.cups[i]+' cups × ₹'+d.margins[i])+'</small></div>').join('')+'</div>';if(phase==='cups'){html+=dialogue(d.prices[0]===d.prices[1]?'Same price. The 200 customers split evenly: 100 cups each.':(d.prices[0]<d.prices[1]?'Your café is cheaper. You sell '+d.cups[0]+' cups; Meera sells '+d.cups[1]+'.':'Meera’s café is cheaper. She sells '+d.cups[1]+' cups; you sell '+d.cups[0]+'.'))+receipt('cups');buttons=btn('What’s left per cup?','result-next')}else if(phase==='margin'){html+=dialogue('Each cup costs ₹50. Subtract that from each café’s selling price.')+receipt('margin');buttons=btn('Count today’s money.','result-next')}else if(phase==='money'){html+=dialogue(E.line(r))+receipt('money')+'<div class="section-label">Money you keep · today only</div>';buttons=btn('Open day two.','morning')}else if(phase==='total'){html+=dialogue('Add yesterday and today. This is how much you each kept.')+'<div class="counters">'+['You','Meera'].map((name,i)=>{const prior=E.pair(r.yours[0],r.hers[0])[i],today=E.pair(r.yours[1],r.hers[1])[i];return '<div class="counter"><span>'+name+' · two days</span><small>Yesterday '+money(prior)+'</small><small>+ today '+money(today)+'</small><b class="total-value" data-before="'+prior+'" data-total="'+r.totals[i]+'">'+money(r.totals[i])+'</b><small>money you keep</small></div>'}).join('')+'</div>';buttons=btn('Open day three.','morning')}else{html+=dialogue(E.line(r))+receipt('money')+'<div class="section-label">Money you keep</div>';if(n>2)html+=counters(r);buttons=n===2?btn('Add our two days.','show-total'):n===10?btn('See the ten days','summary'):btn('Open day '+(n+1)+'.','morning')}}
if(n>=3&&phase==='result'){const d=E.detail(r.yours.at(-1),r.hers.at(-1));html='<div class="eyebrow">02 / Tomorrow exists · run '+(state.first?2:1)+'</div><h1>Today · day '+n+(n===10?' · final day':'')+'</h1>'+customerScene(d)+dialogue(dailyCause(d,n),'thinking')+'<div class="daily-money"><div><span>You keep today</span><b>'+money(d.retained[0])+'</b><small>'+d.cups[0]+' cups × ₹'+d.margins[0]+'</small></div><div><span>Meera keeps today</span><b>'+money(d.retained[1])+'</b><small>'+d.cups[1]+' cups × ₹'+d.margins[1]+'</small></div></div><div class="running-compact">So far · You '+money(r.totals[0])+' · Meera '+money(r.totals[1])+'</div>';if(n<10){html+='<div class="tomorrow"><h2>Tomorrow · day '+(n+1)+'</h2><div class="copy-link"><span>You today<br><b>₹'+r.yours.at(-1)+'</b></span><span aria-hidden="true">→</span><span>Meera tomorrow<br><b>₹'+r.yours.at(-1)+'</b></span></div>'+compactPicker()+'</div>';buttons=btn('Confirm day '+(n+1)+' · ₹'+state.selectedPrice,'confirm-price')}else buttons=btn('See the ten days','summary')}

}else if(s===9){html='<div class="eyebrow">03 / What happened</div><h1>Ten days.</h1>';if(state.first){html+='<div class="comparison">'+[state.first,r].map((run,i)=>`<section><h3>Run ${i+1}</h3>${history(run)}${counters(run,false)}</section>`).join('')+'</div>'}else html+=history(r)+counters(r,false);html+=dialogue(E.recap(r).join(' '),'thinking')+'<div class="summary"><p>Meera is a programmed character: ₹100 on day one, then your previous day’s price.</p><p>Your money came from cups sold × money kept per cup. Lower prices changed both.</p><p>These results depend on this customer rule, Meera’s rule and the ten-day ending.</p></div>';buttons=(state.first?'':btn('Run the ten days again','replay'))+btn('Stop here.','finish',true);
}else{html='<div class="eyebrow">Lesson complete</div><h1>Is there a next move?</h1>'+art('cafes',E.expression(r),'Meera');const lines=['In the rooms, talking cut your years either way. With Meera, your price sets her next price—until day ten. The last day has no next move.','Your price changed how many cups you sold, how much you kept per cup, and Meera’s next price. On day ten, that last effect stopped.','Before choosing, ask: could today change their next move—and is there a next move?'];html+=dialogue(lines[state.beat],'thinking');buttons=state.beat<2?btn('Continue','takeaway'):btn('Review my ten days','summary',true)}
$('#app').className=(animate?'settle ':'')+(s===3?'deal-screen':'')+(s===8&&n>=3&&state.phase==='result'?' visual-loop':'')+(s===7?' cafe-intro':'');$('#app').innerHTML=html+`<div class="actions ${s===3&&state.dealBeat===5?'two':''}">${buttons}</div>`;const renderId=generation;if(animate&&!reducedMotion.matches){const totals=[...$('#app').querySelectorAll('.total-value')];if(totals.length){totals.forEach(el=>el.textContent=money(Number(el.dataset.before)));const began=performance.now()+180;const tick=now=>{if(renderId!==generation)return;const t=Math.min(1,Math.max(0,(now-began)/620));for(const el of totals){const before=Number(el.dataset.before),after=Number(el.dataset.total);el.textContent=money(Math.round(before+(after-before)*(1-Math.pow(1-t,3))));}if(t<1)totalFrame=requestAnimationFrame(tick);else totalFrame=null;};totalFrame=requestAnimationFrame(tick);}}$('#app').querySelectorAll('button').forEach(b=>b.onclick=()=>{const action=b.dataset.action,isPriceAdjust=action==='price-up'||action==='price-down';if(locked||renderId!==generation||(!isPriceAdjust&&performance.now()-lastActionAt<350))return;if(!isPriceAdjust)lastActionAt=performance.now();locked=true;const next={...state};if(action==='next'){next.scene++;next.reasoningBeat=0;}else if(action==='reason-next')next.reasoningBeat=(state.reasoningBeat||0)+1;else if(action==='deal-next')next.dealBeat=(state.dealBeat||0)+1;else if(action==='silent'||action==='talk'){if(state.scene!==3||state.dealBeat!==5)return;next.prison=action;next.scene=4}else if(action==='cafe-intro')next.cafeBeat++;else if(action==='open-cafe'){next.scene=8;next.phase='choose';next.migrationNotice=false;}else if(action==='morning'){next.phase='choose';}else if(action==='result-next')next.phase=state.phase==='cups'?'margin':'money';else if(action==='show-total')next.phase='total';else if(action==='price-down'||action==='price-up'){next.selectedPrice=Math.max(50,Math.min(100,state.selectedPrice+(action==='price-up'?10:-10)));}else if(action==='confirm-price'){if(state.phase!=='choose'&&!(state.phase==='result'&&n>=3&&n<10))return;next.run=E.step(state.run,state.selectedPrice,n+1);next.phase=n===0?'cups':'result';}else if(action==='summary')next.scene=9;else if(action==='replay'){next.first=state.run;next.run=E.fresh();next.scene=8;next.phase='choose';next.selectedPrice=100;}else if(action==='finish'){next.scene=10;next.beat=0}else if(action==='takeaway')next.beat++;state=next;event(action,{scene:state.scene,day:state.run.yours.length,pair:state.run.yours.length?[state.run.yours.at(-1),state.run.hers.at(-1)]:null});render(action==='confirm-price'||action==='show-total'||state.scene===4);if(action.startsWith('price-')){const target=$('#app').querySelector('[data-action="'+action+'"]:not(:disabled)')||$('#app').querySelector('.price-picker button:not(:disabled)');target?.focus({preventScroll:true});}else window.scrollTo({top:0,behavior:'instant'})});save()}
$('#reset').onclick=()=>{if(confirm('Start over and clear this device’s saved lesson?')){state=initial();event('reset');render();window.scrollTo(0,0)}};render();window.lessonDebug={getState:()=>structuredClone(state)};
</script></html>
